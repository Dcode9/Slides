<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3e8d2">
<meta name="description" content="Glimpses of India — Goa (A Baker from Goa) and Sikkim: folk dance, culture and food. A paper-cut diorama presentation by Class X Sigma.">
<title>Glimpses of India · Goa & Sikkim · Class X Sigma</title>
<style>
:root{
  --cream:#f3e8d2;
  --sage:#9bb89b;
  --moss:#5f7f5b;
  --teal:#274e52;
  --ochre:#d9a45b;
  --orange:#c8642d;
  --ink:#3b2b1d;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",P052,"URW Palladio L",Georgia,serif;
  --shade:rgba(58,38,18,.34);
  --edge:rgba(255,250,236,.5);
  --paper:#f8efdb;
  --paper-ink:#3b2b1d;
  --kick:#9a5526;
  --em:#c8642d;
  --sub:#5b4632;
  --dash:rgba(122,78,40,.35);
  --W:1920px;--H:1080px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#1f3a3c;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.night{--shade:rgba(6,6,32,.62);--edge:rgba(176,186,255,.2);--paper:#e7e1ef;--paper-ink:#2a2644;--kick:#7b5aa6;--em:#8d4a86;--sub:#4a4468;--dash:rgba(70,60,120,.4)}

/* ---------- the box (a fixed 1920x1080 diorama, scaled to fit the screen) ---------- */
.stage{position:fixed;inset:0;overflow:hidden;overflow:clip;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.viewport{position:absolute;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0;overflow:hidden;overflow:clip;background:#1f3a3c}
.sky{position:absolute;inset:0;background:radial-gradient(120% 75% at 70% 22%,#fbf3e1 0%,#f3e8d2 42%,#ecd9b4 100%)}
.sky-night{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease;background:radial-gradient(95% 70% at 70% 20%,#3a3f8a 0%,#252a69 36%,#161a45 72%,#10132f 100%)}
body.night .sky-night{opacity:1}
.sky-grain{position:absolute;inset:0;width:100%;height:100%;opacity:.9;transition:opacity 1.4s ease}
.pins{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;visibility:hidden;transition:opacity 1.2s ease .5s,visibility 1.2s ease .5s}
body.night .pins{opacity:1;visibility:visible}
.pins circle{fill:#fff4d6;transform-box:fill-box;transform-origin:center}
.pins .tw{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.3);opacity:.35}}

.layer{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;contain:layout style}
.layer>svg{display:block;overflow:visible}
.cut{filter:drop-shadow(0 -1px 0 var(--edge)) drop-shadow(0 calc(var(--sh,4) * 1px) calc(var(--sh,4) * 1.5px) var(--shade));transition:filter 1.2s ease var(--d,0s)}
.place>svg{animation:placeIn .9s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes placeIn{from{transform:translateY(7%);opacity:0}to{transform:none;opacity:1}}

.layer [class*="c-"],.layer .winglow,.layer .lampglow,.layer .puff,.grain{transition:fill 1.25s cubic-bezier(.55,.05,.3,1) var(--d,0s),opacity 1.25s ease var(--d,0s),stroke 1.25s ease var(--d,0s)}
.grain{fill:url(#grainPat);pointer-events:none;transition:opacity 1.2s ease}
body.night .grain{opacity:.5}
body.night .sky-grain{opacity:.35}

/* day / night paper stock (reference palette) */
.c-far{fill:#dfdec3} body.night .c-far{fill:#4a508f}
.c-hill{fill:#bdcfb2} body.night .c-hill{fill:#3e4487}
.c-roof{fill:#a8bd9c} body.night .c-roof{fill:#353b7b}
.c-win{fill:#8aa083} body.night .c-win{fill:#ffd57c}
.winglow{opacity:0} body.night .winglow{opacity:1}
.c-ridge{fill:#9bb89b} body.night .c-ridge{fill:#343a7c}
.c-meadow{fill:#7e9c74} body.night .c-meadow{fill:#2b3071}
.c-river{fill:#b7d2c8} body.night .c-river{fill:#5763ae}
.c-ripple{fill:#f1f2e3} body.night .c-ripple{fill:#b9c1f2}
.glint{fill:#fff3c9;opacity:0} body.night .glint{opacity:.95;animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.95}50%{opacity:.12}}
.c-moss{fill:#5f7f5b} body.night .c-moss{fill:#24295f}
.c-teal{fill:#274e52} body.night .c-teal{fill:#1a1d4e}
.c-ground{fill:#d9a45b} body.night .c-ground{fill:#352b63}
.c-burrow{fill:#4a3019} body.night .c-burrow{fill:#110e2a}
.c-stem{fill:#f0e3c6} body.night .c-stem{fill:#8d86b9}
.c-cap{fill:#c8642d} body.night .c-cap{fill:#7b3e6b}
.c-dot{fill:#f8efdc} body.night .c-dot{fill:#aef6e4}
.c-fern{fill:#5f7f5b} body.night .c-fern{fill:#262d62}
.c-fall1{fill:#c9713a} body.night .c-fall1{fill:#5a3766}
.c-fall2{fill:#b98f4c} body.night .c-fall2{fill:#443d78}
.c-tuft{fill:#8a9a55} body.night .c-tuft{fill:#2c2a5c}
.c-pebble{fill:#e9dcc0} body.night .c-pebble{fill:#5a5690}
.c-fg{fill:#1f4245} body.night .c-fg{fill:#121439}
.c-fg2{fill:#3d6a50} body.night .c-fg2{fill:#1b1d4a}
.c-bell{fill:#c8642d} body.night .c-bell{fill:#8a4a86}
.c-bell2{fill:#efc27d} body.night .c-bell2{fill:#d7a3d8}
.c-mat{fill:#efe3c9} body.night .c-mat{fill:#8f8bb6}
.c-frame{fill:#1c3739} body.night .c-frame{fill:#0b0c27}
.c-fox{fill:#c8642d} body.night .c-fox{fill:#a14f36}
.c-foxc{fill:#f6ecd6} body.night .c-foxc{fill:#d2cbe4}
.c-foxd{fill:#3a2b24} body.night .c-foxd{fill:#17152f}
.glowdots{filter:url(#softGlow)}
.puff{fill:#e0b673;opacity:0} body.night .puff{fill:#9d96cc}
/* new paper stock for Goa & Sikkim (same family of tints) */
.c-snow{fill:#f7f2e4} body.night .c-snow{fill:#aab0e0}
.c-gold{fill:#e0b060} body.night .c-gold{fill:#8b7cb0}
.c-wood{fill:#8a5a30} body.night .c-wood{fill:#2a2550}
.c-skin{fill:#d9a45b} body.night .c-skin{fill:#8d86b9}
.c-blue{fill:#6f8fae} body.night .c-blue{fill:#3a4580}
.c-wall{fill:#f6ecd6} body.night .c-wall{fill:#cfc7e2}
.c-yellow{fill:#efc27d} body.night .c-yellow{fill:#b193c7}
.c-smoke{fill:#f6ecd6;opacity:.6} body.night .c-smoke{fill:#b9b4d6}
.c-lamp{fill:#ffd57c} body.night .c-lamp{fill:#ffd57c}
.lampglow{opacity:0} body.night .lampglow{opacity:1}

/* ---------- hanging things ---------- */
.hang{position:absolute;top:0;transition:transform 1.6s cubic-bezier(.5,-.28,.25,1.22);transition-delay:var(--hd,0s)}
.hang .swing{position:relative;transform-origin:50% 0;animation:swing var(--sd,5s) ease-in-out infinite alternate;animation-delay:var(--sdl,0s)}
.hang .string{position:absolute;left:50%;top:0;width:1px;margin-left:-.5px;height:var(--len);background:linear-gradient(rgba(74,54,34,.25),rgba(74,54,34,.6))}
body.night .hang .string{background:linear-gradient(rgba(220,220,255,.08),rgba(220,220,255,.36))}
.hang .obj{position:absolute;left:50%;top:var(--len);transform:translate(-50%,-6%);filter:drop-shadow(0 5px 6px var(--shade))}
.hang .obj svg{display:block;overflow:visible}
.hang.day{transform:none}
body.night .hang.day{transform:translateY(calc(-1px * var(--up)))}
.hang.nite{transform:translateY(calc(-1px * var(--up)))}
body.night .hang.nite{transform:none}
@keyframes swing{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.halo{position:absolute;left:50%;top:50%;width:260%;height:260%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.34) 0%,rgba(255,236,190,.12) 34%,rgba(255,236,190,0) 66%);pointer-events:none}

/* ---------- leaves / fireflies ---------- */
.leaf{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(1px 4px 3px var(--shade))}
.leaf svg{display:block}
.lf-a{fill:#d9a45b} body.night .lf-a{fill:#6c5a8f}
.lf-b{fill:#c8642d} body.night .lf-b{fill:#7a4577}
.lf-c{fill:#9bb89b} body.night .lf-c{fill:#4a569a}
.lf-v{fill:none;stroke:rgba(255,246,226,.55);stroke-width:.7} body.night .lf-v{stroke:rgba(210,210,255,.3)}
.leaf path{transition:fill 1.2s ease .6s}
#flies{pointer-events:none}

.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 16vmin rgba(60,36,14,.22);transition:box-shadow 1.4s ease}
body.night .vignette{box-shadow:inset 0 0 22vmin rgba(2,2,20,.55)}

/* ---------- paper labels (the reference tag, extended into a family of cards) ---------- */
.content{position:absolute;left:0;top:0;width:var(--W);height:var(--H);will-change:transform;pointer-events:none}
.slot{position:absolute;top:0;width:var(--W);height:var(--H);contain:layout style}
.slot:not(.on):not(.off){visibility:hidden;pointer-events:none;content-visibility:hidden}
.slot.on,.slot.off{visibility:visible}
.slot>*{position:absolute}
.slot .anim{opacity:0}
.slot.on .anim{animation:placeIn .9s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0) * 110ms + 380ms)}
.slot.on .anim.drop{animation-name:dropIn}
@keyframes dropIn{from{transform:translateY(-6%);opacity:0}to{transform:none;opacity:1}}
.slot.off .anim{animation:placeOut .45s ease both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes placeOut{from{transform:none;opacity:1}to{transform:translateY(5%);opacity:0}}
.slot.on li,.slot.on .row,.slot.on .mini,.slot.on .tl>div{animation:placeIn .7s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0) * 110ms + var(--j,0) * 85ms + 620ms)}
.slot:not(.on) li,.slot:not(.on) .row,.slot:not(.on) .mini,.slot:not(.on) .tl>div{opacity:0}

.tag-wrap{transform-origin:50% 0;will-change:transform;filter:drop-shadow(2px 10px 9px var(--shade))}
.tag-wrap.swingy{animation:swing var(--sd,5s) ease-in-out infinite alternate;animation-delay:var(--sdl,0s)}
.tag.small{padding:44px 22px 22px}
.tag.small .sub{font-size:15px;max-width:30ch}
.tag-string{display:block;margin:0 auto;width:1px;height:var(--len,54px);background:linear-gradient(rgba(74,54,34,.2),rgba(74,54,34,.7))}
body.night .tag-string{background:linear-gradient(rgba(230,230,255,.1),rgba(230,230,255,.45))}
.tag{position:relative;width:var(--tw,290px);padding:52px 28px 26px;text-align:center;pointer-events:auto;
  background:var(--paper);color:var(--paper-ink);
  clip-path:polygon(24% 0,76% 0,100% 16%,100% 100%,0 100%,0 16%);
  transition:background-color 1.2s ease,color 1.2s ease}
.tag>*{position:relative}
.tag::after{content:"";position:absolute;inset:7px;border:1px dashed var(--dash);clip-path:polygon(23% 0,77% 0,100% 15%,100% 100%,0 100%,0 15%);pointer-events:none}
.tag-hole{position:absolute;left:50%;top:15px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#1f3a3c;box-shadow:0 0 0 3.5px var(--ochre),0 0 0 4.5px rgba(90,56,24,.35);transition:background-color 1.2s ease}
body.night .tag-hole{background:#141841}
.tag-knot{position:absolute;left:50%;top:-2px;width:1px;height:25px;margin-left:-.5px;background:rgba(74,54,34,.7)}
body.night .tag-knot{background:rgba(230,230,255,.45)}
.kicker{margin:0 0 8px;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--kick);font-variant-numeric:oldstyle-nums;transition:color 1.2s ease}
.tag h1{margin:0;font-weight:400;font-size:64px;line-height:.96;letter-spacing:-.01em}
.tag h1 em,.card h2 em,.card h3 em,.big em{display:block;font-style:italic;color:var(--em);font-size:1.12em;letter-spacing:0;transition:color 1.2s ease}
.card h2 em.in,.card h3 em.in{display:inline;font-size:1em}
.tag .sub{margin:14px auto 0;max-width:26ch;font-size:17px;line-height:1.42;font-style:italic;color:var(--sub);transition:color 1.2s ease}
.rule{display:block;width:44px;height:6px;margin:12px auto 0;background:radial-gradient(circle,var(--moss) 1.4px,transparent 1.8px) 0 50%/9px 6px repeat-x}
.rule.left{margin-left:0}

/* a sheet of paper: the tag's cousin */
.card-wrap{position:relative;filter:drop-shadow(0 -1px 0 var(--edge)) drop-shadow(0 9px 9px var(--shade))}
.card-wrap.pinned::before{content:"";position:absolute;left:50%;top:-9px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#1f3a3c;box-shadow:0 0 0 3.5px var(--ochre),0 0 0 4.5px rgba(90,56,24,.35);z-index:2}
.card{position:relative;background:var(--paper);color:var(--paper-ink);padding:30px 36px 30px;pointer-events:auto;
  clip-path:var(--clip);transition:background-color 1.2s ease,color 1.2s ease;font-size:21.5px;line-height:1.38}
.card::after{content:"";position:absolute;inset:9px;border:1px dashed var(--dash);clip-path:var(--clip2);pointer-events:none}
.card>*{position:relative}
.card h2{margin:0 0 6px;font-weight:400;font-size:46px;line-height:1.02;letter-spacing:-.01em}
.card h3{margin:0 0 6px;font-weight:400;font-size:30px;line-height:1.08}
.card .sub{margin:0 0 10px;font-size:18px;line-height:1.4;font-style:italic;color:var(--sub);transition:color 1.2s ease}
.card .rule{margin:10px 0 14px}
.card p{margin:0 0 10px}
.card ul{margin:0;padding:0;list-style:none}
.card li{position:relative;padding-left:26px;margin:0 0 9px}
.card li::before{content:"";position:absolute;left:3px;top:.52em;width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--moss);opacity:.85}
.card li b,.card .row b{font-weight:600}
.card .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.card .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:26px}
.card .note{font-size:16.5px;font-style:italic;color:var(--sub);margin-top:8px}
.card .lead{font-size:23px}
.card em.o{color:var(--em);font-style:italic}
.small{font-size:17px;line-height:1.35}
.card .cap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--kick);margin:0 0 6px}

/* member / outcome tables */
.roster{width:100%;border-collapse:collapse;font-size:21px}
.roster td,.roster th{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px dashed var(--dash)}
.roster th{font-weight:400;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--kick)}
.roster td:first-child{white-space:nowrap}
.roster .n{font-size:24px}
.roster .r{color:var(--sub);font-style:italic;white-space:nowrap}
.roster tr:last-child td{border-bottom:0}
.badge{display:inline-block;margin-left:8px;padding:1px 9px 2px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#f8efdb;background:var(--teal);clip-path:polygon(2% 10%,98% 0,100% 90%,0 100%)}
body.night .badge{background:#3a3f86}

/* timeline */
.tl{display:grid;grid-template-columns:150px 1fr;row-gap:0}
.tl>div{padding:7px 0 7px 0;border-bottom:1px dashed var(--dash)}
.tl>div:nth-last-child(-n+2){border-bottom:0}
.tl .yr{font-style:italic;color:var(--em);font-size:22px;padding-right:12px}

/* comparison table */
.cmp{width:100%;border-collapse:collapse;font-size:19.5px;line-height:1.32}
.cmp th{font-weight:400;text-align:left;padding:6px 12px 10px;font-size:26px;border-bottom:2px solid var(--dash)}
.cmp th:first-child{width:118px}
.cmp th em{color:var(--em)}
.cmp td{padding:11px 12px;vertical-align:top;border-bottom:1px dashed var(--dash)}
.cmp tr:last-child td{border-bottom:0}
.cmp td:first-child{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--kick);padding-top:16px}
.cmp td.th{background:rgba(155,184,155,.18)}
body.night .cmp td.th{background:rgba(120,110,190,.18)}

/* mini cards grid (learning outcomes) */
.grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 24px}
.mini{position:relative;background:rgba(255,255,255,.28);padding:16px 18px 14px;clip-path:var(--mclip);font-size:19px;line-height:1.35}
body.night .mini{background:rgba(60,50,110,.18)}
.mini .who{font-size:25px;margin:0 0 4px}
.mini .who span{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--kick);margin-left:8px}

/* the poster frame */
.poster-wrap{filter:drop-shadow(0 -1px 0 var(--edge)) drop-shadow(0 14px 14px var(--shade))}
.poster{position:relative;background:var(--paper);padding:22px;clip-path:var(--clip);transition:background-color 1.2s ease}
.poster .ph{position:relative;width:100%;height:100%;background:#efe3c9;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;pointer-events:auto}
body.night .poster .ph{background:#cfc7e2}
.poster .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.poster .ph.has img{display:block}
.poster .ph.has .ph-text{display:none}
.poster .ph-text{position:relative;padding:28px;color:var(--sub);font-style:italic;font-size:20px;line-height:1.45}
.poster .ph-text b{display:block;font-style:normal;font-size:30px;color:var(--paper-ink);margin-bottom:8px}
.poster .ph::after{content:"";position:absolute;inset:14px;border:1px dashed var(--dash);pointer-events:none}
.poster .corner{position:absolute;width:38px;height:38px;background:var(--paper);clip-path:polygon(0 0,100% 0,0 100%);filter:drop-shadow(1px 2px 2px rgba(0,0,0,.25));z-index:3}
.poster .corner.tr{transform:rotate(90deg)}.poster .corner.br{transform:rotate(180deg)}.poster .corner.bl{transform:rotate(270deg)}

/* captions in the scene (the reference "hint" style) */
.scene-note{padding:8px 14px;font-size:15.5px;font-style:italic;line-height:1.35;color:#f8efdb;background:rgba(28,55,57,.78);
  clip-path:polygon(0 8%,40% 0,100% 6%,99% 94%,55% 100%,1% 96%);transition:background-color 1.2s ease;white-space:nowrap}
body.night .scene-note{background:rgba(12,13,40,.8);color:#e7e1ef}
.scene-note b{font-weight:600;font-style:normal;color:#f2c47f}

/* ---------- controls ---------- */
.controls{position:absolute;right:48px;bottom:40px;z-index:11;display:flex;gap:12px;align-items:center}
.chip{appearance:none;display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:0;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;background:#f8efdb;pointer-events:auto;
  clip-path:polygon(2% 6%,30% 0,62% 4%,99% 1%,100% 52%,98% 96%,64% 100%,34% 97%,1% 100%,0 48%);
  filter:drop-shadow(0 4px 5px var(--shade));transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color 1.2s ease,color 1.2s ease}
.chip[hidden]{display:none}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.chip:active{transform:translateY(1px) scale(.98)}
.chip:focus-visible{outline:none;background:#fff7e4;box-shadow:inset 0 0 0 2px var(--orange)}
body.night .chip{background:#e7e1ef;color:#2a2644}
.chip.counter{cursor:default;padding:10px 14px;font-style:italic}
.chip.counter b{font-weight:400;font-style:normal;font-variant-numeric:tabular-nums}
.chip svg.arrow{width:18px;height:18px}
.track{position:relative;width:52px;height:26px;border-radius:13px;background:#d9c7a1;box-shadow:inset 0 2px 3px rgba(80,50,20,.3);transition:background-color .9s ease}
body.night .track{background:#3a3f86}
.knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;transition:transform .7s cubic-bezier(.5,-.3,.3,1.35)}
body.night .knob{transform:translateX(26px)}
.knob svg{position:absolute;inset:0;width:22px;height:22px;transition:opacity .5s ease,transform .7s ease}
.knob .k-moon{opacity:0;transform:rotate(-90deg)}
body.night .knob .k-sun{opacity:0;transform:rotate(90deg)}
body.night .knob .k-moon{opacity:1;transform:none}
.chip-label{min-width:3.2em;text-align:left;font-style:italic}
.hint{position:absolute;left:48px;bottom:40px;z-index:11;margin:0;padding:9px 14px;max-width:560px;font-size:15px;font-style:italic;line-height:1.35;color:#f8efdb;background:rgba(28,55,57,.78);
  clip-path:polygon(0 8%,40% 0,100% 6%,99% 94%,55% 100%,1% 96%);transition:opacity .8s ease,background-color 1.2s ease;pointer-events:none}
body.night .hint{background:rgba(12,13,40,.8);color:#e7e1ef}
.hint b{font-weight:600;font-style:normal;color:#f2c47f}
.hint.gone{opacity:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.panda-btn{position:absolute;left:0;top:0;width:10px;height:10px;padding:0;margin:0;border:0;border-radius:40%;background:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.panda-btn:focus-visible{outline:2px dashed #fff6df;outline-offset:4px}
@media (prefers-reduced-motion:reduce){
  .place>svg,.slot.on .anim,.slot.on li,.slot.on .row,.slot.on .mini,.slot.on .tl>div{animation-duration:.01s;animation-delay:0s}
  .hang .swing,.pins .tw{animation:none}
}
/* adaptive lite: keep the paper, drop the continuous compositing */
body.lite2 .glint,body.lite2 .pins .tw,body.lite2 .hang .swing,body.lite2 .tag-wrap.swingy{animation:none!important}
body.lite2 .place>svg,body.lite2 .slot.on .anim,body.lite2 .slot.on li,body.lite2 .slot.on .row,body.lite2 .slot.on .mini,body.lite2 .slot.on .tl>div{animation-duration:.28s!important;animation-delay:0s!important}
body.lite2 .cut{transition:none}
body.lite2 .layer [class*="c-"],body.lite2 .puff,body.lite2 .grain{transition-duration:.3s}
/* grain overlays must stay out of flow (after the .tag>* / .card>* rules) */
.tag-grain,.card-grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}


/* ---------- Speaker badge ---------- */
.speaker-tag{position:absolute;top:24px;right:28px;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--kick);background:rgba(154,85,38,.09);border:1px solid rgba(154,85,38,.24);border-radius:999px;padding:5px 14px;font-family:var(--serif);font-weight:600;pointer-events:none;z-index:2;white-space:nowrap}
body.night .speaker-tag{color:#d5ceea;background:rgba(123,90,166,.2);border-color:rgba(123,90,166,.38)}

/* ---------- Thank You Slide & Sources Pull-Down ---------- */
#slot17 .sources-card-pos{transform:translateY(-140%) rotate(-.4deg) !important;opacity:0;pointer-events:none;transition:transform .85s cubic-bezier(.16,1,.3,1),opacity .45s ease;z-index:10}
#slot17.show-sources .sources-card-pos{transform:translateY(0) rotate(-.4deg) !important;opacity:1;pointer-events:auto}
#slot17 .thanks-tag{left:650px !important;transition:left .85s cubic-bezier(.16,1,.3,1) !important}
#slot17.show-sources .thanks-tag{left:1140px !important}

.sources-btn{display:inline-flex;align-items:center;gap:10px;background:var(--paper);color:var(--paper-ink);border:1px dashed var(--dash);padding:10px 24px;font-family:var(--serif);font-size:16px;font-style:italic;cursor:pointer;border-radius:6px;box-shadow:0 4px 12px var(--shade);transition:transform .2s ease,background .2s ease,border-color .2s ease;pointer-events:auto}
.sources-btn:hover{background:#fdf9f1;transform:translateY(-2px);border-color:var(--kick)}
.sources-btn:active{transform:translateY(0)}
.sources-btn-icon{display:inline-block;transition:transform .3s ease;font-style:normal;font-size:16px;font-weight:bold}
body.night .sources-btn{background:#2a2448;color:#eee6f7;border-color:rgba(176,186,255,.35)}
body.night .sources-btn:hover{background:#352e5a;border-color:var(--kick)}

<body>
<main class="stage" id="stage" aria-label="Glimpses of India: a paper-cut diorama presentation that walks from a forest hollow to Goa and up to Sikkim">
  <div class="viewport" id="vp">
    <div class="sky" id="sky">
      <div class="sky-night"></div>
      <svg class="sky-grain" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grainPat)"/></svg>
      <svg class="pins" id="pins" aria-hidden="true" focusable="false"></svg>
    </div>
    <div class="layer" id="hangs" data-depth="0.4" aria-hidden="true"></div>
    <div id="layers"></div>
    <div class="content" id="content"></div>
    <nav class="controls" aria-label="Presentation controls">

      <span class="chip counter" id="counter" aria-live="polite"></span>

      <button type="button" class="chip" id="toggle" aria-pressed="false" aria-label="Night">
        <span class="track" aria-hidden="true"><span class="knob">
          <svg class="k-sun" viewBox="-11 -11 22 22" focusable="false"><g fill="#c8642d"><circle r="5.6"/><path d="M0-10 1.6-6.8h-3.2zM0 10l1.6-3.2h-3.2zM-10 0l3.2 1.6v-3.2zM10 0 6.8 1.6v-3.2zM-7 -7l3.4 1.2-2.2 2.2zM7 7 3.6 5.8l2.2-2.2zM7 -7 5.8-3.6 3.6-5.8zM-7 7l1.2-3.4 2.2 2.2z"/></g></svg>
          <svg class="k-moon" viewBox="-11 -11 22 22" focusable="false"><path fill="#f4ead2" d="M3.2-8.6A9 9 0 1 0 8.8 4 7.2 7.2 0 0 1 3.2-8.6z"/></svg>
        </span></span>
        <span class="chip-label" id="toggleLabel">Day</span>
      </button>
      <button type="button" class="chip" id="embed" hidden aria-label="Save a copy of this presentation with the poster embedded"><span class="chip-label" style="min-width:0">Save copy with poster</span></button>
      <button type="button" class="chip" id="full" aria-label="Full screen"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </nav>
    <p class="hint" id="hint"><span id="hintText"><b>→</b> walks to the next plate · <b>click the red panda</b> · <b>N</b> night · <b>F</b> full screen</span></p>
  </div>
</main>
<p class="sr-only" aria-live="polite" id="live"></p>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="grainPat" patternUnits="userSpaceOnUse" width="160" height="160"><image id="grainImg" width="160" height="160"/></pattern>
    <radialGradient id="winGlowGrad"><stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/><stop offset=".45" stop-color="#ffc766" stop-opacity=".22"/><stop offset="1" stop-color="#ffc766" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampGlowGrad"><stop offset="0" stop-color="#ffd98a" stop-opacity=".8"/><stop offset=".4" stop-color="#ffc766" stop-opacity=".25"/><stop offset="1" stop-color="#ffc766" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<script>
/* ======================================================================
   PAPER — scissor-cut geometry. The first half is a straight port of the
   reference diorama's helpers; the second half is the new vocabulary for
   Goa and Sikkim (palms, churches, gompas, flags, dancers, a red panda).
   Everything returns SVG path data or small SVG markup strings; colours
   come from the .c-* paper-stock classes so day/night keeps working.
   ====================================================================== */
const PAPER = (() => {
  'use strict';
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  let R = mulberry32(1847);
  const setSeed = s => { R = mulberry32(s); };
  const rr = (a,b) => a + (b-a)*R();
  const q = n => Math.round(n*10)/10;
  const clamp = (v,a,b) => v<a?a:v>b?b:v;
  const lerp = (a,b,t) => a+(b-a)*t;
  const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };

  /* ---------- paper geometry (reference) ---------- */
  function area(p){let a=0;for(let i=0;i<p.length;i++){const u=p[i],v=p[(i+1)%p.length];a+=u[0]*v[1]-v[0]*u[1];}return a;}
  function orient(p){return area(p)<0?p.slice().reverse():p;}
  function trace(p,j,step){
    let s='';const n=p.length;
    for(let i=0;i<n;i++){
      const a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,k=Math.max(1,Math.round(L/step)),nx=-dy/L,ny=dx/L;
      for(let t=0;t<k;t++){
        let x=a[0]+dx*t/k,y=a[1]+dy*t/k;
        if(t>0){const o=(R()-.5)*2*j;x+=nx*o;y+=ny*o;}
        s+=(s?'L':'M')+q(x)+' '+q(y);
      }
    }
    return s+'Z';
  }
  const cut  = (p,j=.7,step=7) => trace(orient(p),j,step);
  const hole = (p,j=.7,step=7) => trace(orient(p).slice().reverse(),j,step);
  function poly(p){p=orient(p);let s='M'+q(p[0][0])+' '+q(p[0][1]);for(let i=1;i<p.length;i++)s+='L'+q(p[i][0])+' '+q(p[i][1]);return s+'Z';}
  function circ(cx,cy,r,n){const p=[];n=n||Math.max(8,Math.round(r*1.4));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return p;}
  function ell(cx,cy,rx,ry,n){const p=[];n=n||Math.max(10,Math.round((rx+ry)*.8));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
  const rect = (x,y,w,h) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  function wave(base,amps,lens){const ph=amps.map(()=>R()*Math.PI*2);return x=>{let y=base;for(let i=0;i<amps.length;i++)y+=amps[i]*Math.sin(x/lens[i]*Math.PI*2+ph[i]);return y;};}
  // a ridge polygon between x0 and x1 whose top edge follows fn
  function ridge(fn,bottom,x0,x1,step=9,j=.9){const p=[];for(let x=x0;x<=x1+step;x+=step)p.push([x,fn(x)+(R()-.5)*2*j]);p.push([x1+step,bottom],[x0,bottom]);return poly(p);}

  function pine(cx,by,h,w){
    const n=h>420?9:h>160?7:h>70?5:h>32?4:3;
    const trunkH=h*.09,crown=h-trunkH,tip=by-h,st=crown/(n+.45);
    const j=Math.max(.45,h/520),step=Math.max(5,h/70),lean=(R()-.5)*w*.12;
    let d='';
    for(let i=0;i<n;i++){
      const top=tip+i*st,bot=tip+(i+1.45)*st,k=(i+1)/n;
      const base=w*.5*(.26+.74*Math.pow(k,.9));
      const hr=base*(1+(R()-.5)*.16),hl=base*(1+(R()-.5)*.16),droop=st*.14;
      const cx0=cx+lean*(1-k);
      d+=cut([[cx0,top],[cx+hr,bot+(R()-.5)*droop],[cx+hr*.5,bot-st*.28],[cx,bot-st*.18],[cx-hl*.5,bot-st*.28],[cx-hl,bot+(R()-.5)*droop]],j,step);
    }
    const tw=Math.max(1.4,w*.055);
    d+=cut([[cx-tw,by+4],[cx-tw*.75,by-trunkH-st*.6],[cx+tw*.75,by-trunkH-st*.6],[cx+tw,by+4]],.3,8);
    return d;
  }
  function blade(bx,by,h,lean,wb){
    const L=[],Rt=[];
    for(let i=0;i<=6;i++){const t=i/6,x=bx+lean*t*t,y=by-h*t,hw=wb*.5*(1-t)*(1-t*.15);L.push([x-hw,y]);if(i<6)Rt.push([x+hw,y]);}
    return poly(L.concat(Rt.reverse()));
  }
  function mushroom(cx,by,s){
    const tilt=(R()-.5)*s*.3,capY=by-s*.86,rx=s*(.46+R()*.16),ry=s*(.34+R()*.12);
    const stem=cut([[cx-s*.17,by+2],[cx-s*.11+tilt*.6,capY+s*.05],[cx+s*.11+tilt*.6,capY+s*.05],[cx+s*.19,by+2]],.35,4);
    const cp=[];
    for(let i=0;i<=14;i++){const a=Math.PI+i/14*Math.PI;cp.push([cx+tilt+Math.cos(a)*rx,capY+Math.sin(a)*ry]);}
    cp.push([cx+tilt+rx*.7,capY+ry*.2],[cx+tilt,capY+ry*.28],[cx+tilt-rx*.7,capY+ry*.2]);
    const cap=cut(cp,.4,4);
    let dots='';const nd=2+Math.floor(R()*3);
    for(let i=0;i<nd;i++){const a=Math.PI*(1.15+R()*.7),rr2=R()*.55+.25;dots+=cut(circ(cx+tilt+Math.cos(a)*rx*rr2,capY+Math.sin(a)*ry*rr2*.9,s*(.05+R()*.05),7),.2,3);}
    return {stem,cap,dots};
  }
  function fern(bx,by,len,dir){
    let d='';const tipX=bx+dir*len*.62,tipY=by-len*.86,cx=bx+dir*len*.02,cy=by-len*.78;
    const P=t=>[(1-t)*(1-t)*bx+2*(1-t)*t*cx+t*t*tipX,(1-t)*(1-t)*by+2*(1-t)*t*cy+t*t*tipY];
    const sp=[],sp2=[];
    for(let i=0;i<=10;i++){const t=i/10,[x,y]=P(t),w=1.8*(1-t)+.4;sp.push([x-w,y]);sp2.push([x+w,y]);}
    d+=poly(sp.concat(sp2.reverse()));
    for(let t=.1;t<.97;t+=.075){
      const [x,y]=P(t),[x2,y2]=P(Math.min(1,t+.01)),ta=Math.atan2(y2-y,x2-x),L=len*.26*(1-t*.78);
      for(const side of [-1,1]){
        const a=ta+side*1.05,ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L,mx=x+Math.cos(a)*L*.5,my=y+Math.sin(a)*L*.5,wd=L*.2;
        d+=cut([[x,y],[mx+Math.cos(a+Math.PI/2)*wd,my+Math.sin(a+Math.PI/2)*wd],[ex,ey],[mx-Math.cos(a+Math.PI/2)*wd,my-Math.sin(a+Math.PI/2)*wd]],.25,4);
      }
    }
    return d;
  }
  function foxglove(bx,by,h,lean,side){
    let stalk='',bells='',inner='';
    const P=t=>[bx+lean*t*t,by-h*t];
    const L=[],Rt=[];
    for(let i=0;i<=8;i++){const t=i/8,[x,y]=P(t),w=2.2*(1-t)+.7;L.push([x-w,y]);Rt.push([x+w,y]);}
    stalk=poly(L.concat(Rt.reverse()));
    for(const sd of [-1,1]){const ll=h*.28;stalk+=cut([[bx,by],[bx+sd*ll*.35,by-ll*.5],[bx+sd*ll*.9,by-ll*.62],[bx+sd*ll*.55,by-ll*.18]],.5,6);}
    for(let t=.36;t<.97;t+=.048){
      const [x,y]=P(t),s=h*.075*(1-(t-.36)*1.05),sd=side*((Math.round(t*100)%3===0)?-1:1);
      if(t>.86){bells+=cut(circ(x+sd*s*.35,y+s*.2,s*.42,7),.2,3);continue;}
      bells+=cut([[x,y-s*.15],[x+sd*s*.55,y+s*.05],[x+sd*s*1.05,y+s*1.05],[x+sd*s*.78,y+s*1.28],[x+sd*s*.38,y+s*1.14],[x+sd*s*.12,y+s*.5]],.25,3);
      inner+=cut(circ(x+sd*s*.66,y+s*1.02,s*.13,6),.1,3);
    }
    return {stalk,bells,inner};
  }
  // rhododendron spike (Sikkim's state tree): same stalk, round flower clusters instead of bells
  function rhodoSpike(bx,by,h,lean,side){
    let stalk='',bells='',inner='';
    const P=t=>[bx+lean*t*t,by-h*t];
    const L=[],Rt=[];
    for(let i=0;i<=8;i++){const t=i/8,[x,y]=P(t),w=2.4*(1-t)+.8;L.push([x-w,y]);Rt.push([x+w,y]);}
    stalk=poly(L.concat(Rt.reverse()));
    for(let t=.2;t<.8;t+=.14){const [x,y]=P(t),ll=h*.2*(1-t*.5);for(const sd of [-1,1])stalk+=cut([[x,y],[x+sd*ll*.4,y-ll*.3],[x+sd*ll,y-ll*.1],[x+sd*ll*.5,y+ll*.12]],.4,5);}
    for(let t=.56;t<1.0;t+=.11){
      const [x,y]=P(t),s=h*.085*(1-(t-.56)*.9),sd=side*((Math.round(t*100)%2===0)?-1:1);
      const cx=x+sd*s*.9,cy=y;
      for(let k=0;k<5;k++){const a=k/5*Math.PI*2+t*7;bells+=cut(circ(cx+Math.cos(a)*s*.5,cy+Math.sin(a)*s*.42,s*.36,7),.2,3);}
      inner+=cut(circ(cx,cy,s*.2,6),.1,3);
    }
    return {stalk,bells,inner};
  }

  /* ---------- new flora ---------- */
  // coconut palm: curved trunk, radiating notched fronds, three nuts
  function palm(cx,by,h,lean,nF){
    nF=nF||7;const top=[cx+lean,by-h];
    const tw=Math.max(1.6,h*.035);
    const trunk=[];const T=10;
    for(let i=0;i<=T;i++){const t=i/T,x=cx+lean*t*t,y=by-h*t,w=tw*(1.25-t*.5);trunk.push([x-w,y]);}
    for(let i=T;i>=0;i--){const t=i/T,x=cx+lean*t*t,y=by-h*t,w=tw*(1.25-t*.5);trunk.push([x+w,y]);}
    let d=cut(trunk,.35,8);
    for(let i=0;i<nF;i++){
      const a=-Math.PI*.95+i/(nF-1)*Math.PI*.9+(R()-.5)*.18,len=h*(.38+R()*.14),droop=.9+R()*.5;
      const pts=[];const S=8;
      // frond centre line: starts along angle a, droops with t
      const px=t=>top[0]+Math.cos(a)*len*t+ (Math.cos(a)>0?1:-1)*0, py=t=>top[1]+Math.sin(a)*len*t+droop*len*t*t*.55;
      const L=[],Rt=[];
      for(let k=0;k<=S;k++){const t=k/S,w=h*.028*(1-t)*(t<.1?t*10:1)+.6;const x=px(t),y=py(t);
        const x2=px(Math.min(1,t+.02)),y2=py(Math.min(1,t+.02)),ta=Math.atan2(y2-y,x2-x),nx=-Math.sin(ta),ny=Math.cos(ta);
        L.push([x+nx*w*2.2,y+ny*w*2.2]);Rt.push([x-nx*w*2.2,y-ny*w*2.2]);}
      d+=cut(L.concat(Rt.reverse()),Math.max(1.2,h*.02),Math.max(4,h*.03));
    }
    for(let k=0;k<3;k++)d+=cut(circ(top[0]+(k-1)*h*.03,top[1]+h*.03,h*.028,8),.2,3);
    return d;
  }
  // round broadleaf tree (mango / cashew / jackfruit)
  function roundTree(cx,by,h,w){
    let d=cut([[cx-w*.05,by+3],[cx-w*.035,by-h*.38],[cx+w*.035,by-h*.38],[cx+w*.05,by+3]],.3,6);
    const lobes=[[0,-.68,.48],[-.3,-.52,.36],[.3,-.5,.38],[-.16,-.78,.3],[.18,-.8,.3],[0,-.45,.4]];
    for(const [lx,ly,lr] of lobes)d+=cut(circ(cx+lx*w,by+ly*h,lr*w*.62,14),Math.max(.6,h*.012),6);
    return d;
  }
  // rhododendron bush: dark leaves and a cluster of red-orange blooms
  function rhodoBush(cx,by,s){
    let leaf='',bloom='',dot='';
    for(let i=0;i<6;i++){const a=Math.PI*1.05+i/5*Math.PI*.9,L=s*(.55+R()*.3);leaf+=cut([[cx,by],[cx+Math.cos(a-.25)*L*.5,by+Math.sin(a-.25)*L*.5],[cx+Math.cos(a)*L,by+Math.sin(a)*L],[cx+Math.cos(a+.25)*L*.5,by+Math.sin(a+.25)*L*.5]],.3,4);}
    const nb=3+Math.floor(R()*3);
    for(let i=0;i<nb;i++){const bx=cx+(R()-.5)*s*.9,byy=by-s*(.45+R()*.4),r=s*(.12+R()*.08);for(let k=0;k<5;k++){const a=k/5*Math.PI*2;bloom+=cut(circ(bx+Math.cos(a)*r*.9,byy+Math.sin(a)*r*.8,r*.62,7),.15,3);}dot+=cut(circ(bx,byy,r*.3,6),.1,3);}
    return {leaf,bloom,dot};
  }

  /* ---------- buildings (local units: width ~100, base at y=0) ---------- */
  const P = (cls,d) => d?`<path class="${cls}" d="${d}"/>`:'';
  const G = (x,y,s,inner,extra='') => `<g transform="translate(${q(x)} ${q(y)}) scale(${q(s)})"${extra}>${inner}</g>`;

  function church(){
    let wall='',roof='',dark='',win='';
    // nave facade with a curved baroque gable
    wall+=cut([[-34,0],[34,0],[34,-50],[31,-58],[22,-64],[12,-70],[4,-75],[-4,-75],[-12,-70],[-22,-64],[-31,-58],[-34,-50]],.5,5);
    // side aisle to the right
    wall+=cut([[34,0],[62,0],[62,-36],[34,-44]],.4,6);
    roof+=cut([[34,-46],[64,-36],[64,-32],[34,-42]],.3,6);
    // bell tower
    wall+=cut([[-56,0],[-30,0],[-30,-86],[-56,-86]],.4,6);
    roof+=cut([[-59,-86],[-27,-86],[-43,-104]],.3,5);
    dark+=poly([[-44,-104],[-42,-104],[-42,-118],[-44,-118]])+poly([[-48,-114],[-38,-114],[-38,-112],[-48,-112]]);
    // cornices
    roof+=poly([[-34,-50],[34,-50],[34,-47],[-34,-47]])+poly([[-57,-62],[-29,-62],[-29,-59],[-57,-59]]);

    <ul>
      <li><b>Fugdi</b> — women whirl in circles with no instruments: clapping and the breathy \u201cfu\u201d sound give the dance its name; Ganesh Chaturthi and <i>vrata</i> days.</li>
      <li><b>Dhalo</b> — slow women\u2019s dance of the Pausha month (Dec–Jan): two rows of up to twelve dancers face each other on moonlit nights.</li>
      <li><b>Ghode Modni</b> — the \u201chorse dance\u201d: warriors with dummy horses and swords recall the Rane fighters of Sattari and Bicholim, to dhol and tasha.</li>
      <li><b>Goff</b> — Shigmo dance of Canacona: dancers braid coloured cords around a pole and unbraid them without a single knot.</li>
      <li><b>Divlyam Nach</b> (lamp dance) — brass lamps balanced on the head to ghumot, samel and cymbals.</li>
      <li><b>Mussol Khel</b> — Chandor\u2019s pestle dance, performed by Christians of Kshatriya descent for a Hindu king\u2019s victory.</li>
      <li><b>Kunbi dance</b> — Goa\u2019s earliest settlers, in the red-checked Kunbi sari; <b>Perni Jagor</b> and <b>Dashavatar</b> — Goa\u2019s oldest mask theatre.</li>
    </ul>
    <p class="note">Also danced: Talgadi, Romat, Tonyamel, Veerabhadra, Dhangar and Morulo.</p>`},
  {type:'note', x:1270, y:905, html:`<b>Fugdi</b> whirl and a <b>Ghode Modni</b> horse-warrior at Shigmo`},
 ],
 scene:{ L7:[{a:.72,fig:'fugdiPair',s:2.5},{a:.9,fig:'ghodeModni',s:2.5},{a:.6,fig:'lampDiya',s:1.6}], L5:[{a:.9,fig:'palmTall'}] } },

/* 5 ─ Folk dances of Goa II */
{ id:'goadance2', panda:.44, items:[
  {type:'card', x:830, y:70, w:970, rot:.4, pin:true, html:`
    <div class="speaker-tag">Presenter: Advay Dabade</div>
    <h2>Dances of the <em class="in">salon</em></h2>
    <ul>
      <li><b>Mando</b> — slow, graceful song-dance in Konkani from Salcete\u2019s Catholic villages (Raia, Loutolim, Curtorim), from about <b>1840</b>; couples with fans and handkerchiefs, flowing into the brisker <b>Dulpod</b>.</li>
      <li><b>Dekhni</b> — \u201cbewitching beauty\u201d: a semi-classical dance of a temple dancer, Indian melody with Western harmony; <i>Hanv Saiba Poltoddi Vetam</i> (Carlos Eugenio Ferreira, 1895).</li>
      <li><b>Corridinho</b> — a Portuguese folk dance of six couples in a circle, quick and cheerful, at weddings and feasts.</li>
      <li><b>Carnival</b> (Intruz) — King Momo\u2019s parades, floats and street dances before Lent.</li>
      <li><b>Tiatr</b> — Konkani musical theatre, first staged in Bombay on <b>17 April 1892</b> by Lucasinho Ribeiro (<i>Italian Bhurgo</i>).</li>
      <li>Instruments: <b>ghumot</b> (clay-pot drum, Goa\u2019s heritage instrument since 2019), samel, kansalem, violin, guitar, mandolin.</li>
    </ul>`},
  {type:'note', x:120, y:905, html:`A <b>Mando</b> couple — fan, handkerchief and a velvet gown — with ghumot and violin`},
 ],
 scene:{ L7:[{a:.2,fig:'mandoCouple',s:2.5},{a:.37,fig:'ghumot',s:1.8},{a:.33,fig:'violin',s:1.6},{a:.06,fig:'carnivalMask',s:1.4}], L5:[{a:.12,fig:'house',s:1.8}] } },

/* 6 ─ Goan culture & cuisine */
{ id:'goaculture', panda:.66, items:[
  {type:'card', x:120, y:84, w:1080, rot:-.3, pin:true, html:`
    <div class="speaker-tag">Presenter: Sarthak Kulkarni</div>
    <h2>Festivals, <em class="in">food</em> and the Goan way</h2>
    <div class="cols3 small" style="margin-top:14px">
      <div><p class="cap">Festivals</p><ul>
        <li><b>Shigmo</b> — spring harvest parades, March</li><li><b>Carnival</b> — three days before Lent</li><li><b>Ganesh Chaturthi</b> — <i>Chavath</i>, with fugdi</li><li><b>São João</b> — 24 June, leaping into wells</li><li><b>Bonderam</b> — Divar island flag festival</li><li><b>Feast of St Francis Xavier</b> — 3 Dec</li></ul></div>
      <div><p class="cap">Food</p><ul>
        <li><b>Fish-curry-rice</b>, the daily meal</li><li><b>Poee & pao</b> — the pader\u2019s breads</li><li><b>Vindaloo, xacuti, sorpotel</b>, prawn balchão</li><li><b>Bebinca</b> — 7 to 16 layers; dodol; sannas</li><li><b>Sol kadhi</b> — kokum and coconut</li><li><b>Feni</b> — cashew or coconut, with urrak</li></ul></div>
      <div><p class="cap">Living</p><ul>
        <li><b>Konkani</b> song, mando and tiatr</li><li><b>Balcão</b> houses, azulejo tiles, Fontainhas</li><li><b>Kunbi sari</b> and the pano bhaju</li><li>Churches, temples and <b>tulsi vrindavans</b></li><li>Coconut, cashew and the Mandovi</li><li><b>Susegad</b> — contented, unhurried</li></ul></div>
    </div>`},
  {type:'note', x:1300, y:905, html:`Fish curry, poee, bebinca, feni and a coconut — a Goan table`},
 ],
 scene:{ L7:[{a:.78,fig:'foodGoa',s:1.9},{a:.93,fig:'coconutNut',s:1.5},{a:.6,fig:'conch',s:1.2}], L5:[{a:.88,fig:'church',s:1.6}], L2:[{a:.86,fig:'house',s:.55}] } },

/* 7 ─ Historical evolution: Goa */
{ id:'goahistory', panda:.72, items:[
  {type:'card', x:120, y:66, w:1150, rot:.3, pin:true, html:`
    <div class="speaker-tag">Presenter: Dhairya Shah</div>
    <h2>How Goa\u2019s dances <em class="in">evolved</em></h2>
    <div class="tl small" style="margin-top:10px">
      <div class="yr">Before 1510</div><div>Kunbi and Gawda tribal dances; temple traditions that seed the Dekhni; <b>Perni Jagor</b> mask theatre; Shigmo harvest processions with Ghode Modni and Goff.</div>
      <div class="yr">1510–1700s</div><div>Portuguese rule: church music, violin and guitar arrive; <b>Carnival</b> and <b>Corridinho</b> enter Catholic Goa; Mussol Khel survives conversion.</div>
      <div class="yr">c. 1840–1900</div><div>The <b>Mando</b> is born in Salcete salons — composers Arnaldo de Menezes (1863–1917), Torquato de Figueiredo, Gizelino Rebelo, Ligorio Costa.</div>
      <div class="yr">1892 · 1895</div><div>Lucasinho Ribeiro stages <i>Italian Bhurgo</i> — <b>Tiatr</b> begins; Carlos Eugenio Ferreira\u2019s <i>Hanv Saiba</i> becomes the Dekhni anthem.</div>
      <div class="yr">1961–1970</div><div>Liberation (19 Dec 1961); the first <b>Mando Festival</b> (Clube Nacional, 1965) takes the dance from drawing rooms to the public stage; <b>Kala Academy</b> founded (1970).</div>
      <div class="yr">Today</div><div>Shigmotsav and Carnival parades, Lokotsav, village <i>zatras</i>; the ghumot declared Goa\u2019s heritage instrument (2019).</div>
    </div>
    <p class="note" style="margin-top:12px"><b>Major exponents:</b> Arnaldo de Menezes, \u201cking of the mando\u201d · Lorna Cordeiro & Chris Perry (Konkani song) · Lucasinho Ribeiro & João Agostinho Fernandes (tiatr) · folk scholars Vinayak Khedekar & Pandurang Phaldesai · Kala Academy Goa.</p>`},
  {type:'note', x:1360, y:905, html:`Ghumot, samel and violin — and a <b>tiatr</b> stage`},
 ],
 scene:{ L7:[{a:.78,fig:'tiatrCurtain',s:1.9},{a:.9,fig:'ghumot',s:1.7},{a:.94,fig:'violin',s:1.5}] } },

/* 8 ─ Introduction to Sikkim */
{ id:'sikkim', panda:.4, items:[
  {type:'card', x:900, y:70, w:900, rot:-.4, pin:true, html:`
    <div class="speaker-tag">Presenter: Dhruv Kumbhar</div>
    <h2>Sikkim — the <em class="in">hidden valley</em></h2>
    <ul>
      <li>India\u2019s <b>22nd state</b> (16 May 1975); capital <b>Gangtok</b>; the second-smallest and least populous state.</li>
      <li>Home of <b>Khangchendzonga</b> (8,586 m), the world\u2019s third-highest peak and Sikkim\u2019s guardian deity; its national park is a UNESCO World Heritage Site (2016).</li>
      <li>Three communities — <b>Lepcha</b> (the first settlers), <b>Bhutia</b> (from Tibet, 13th–17th c.) and <b>Nepali</b> (since the 19th c.).</li>
      <li>Languages: Nepali, Bhutia, Lepcha, Limbu and English; Buddhism and Hinduism side by side.</li>
      <li>Monasteries of <b>Rumtek, Pemayangtse</b> (1705), Tashiding and Enchey; the Teesta and Rangit rivers.</li>
      <li>The world\u2019s first fully <b>organic state</b> (2016); India\u2019s largest cardamom grower; one tea garden, Temi.</li>
      <li>State symbols: <b>red panda</b> · blood pheasant · noble orchid · rhododendron.</li>
    </ul>`},
  {type:'note', x:130, y:905, html:`A gompa under the snows, prayer flags, a yak and rhododendron — and our guide, the <b>red panda</b>`},
 ],
 scene:{ L5:[{a:.23,fig:'gompa',s:1.9},{a:.33,fig:'flags'}], L7:[{a:.3,fig:'yak',s:2.2},{a:.47,fig:'chorten',s:1.5},{a:.06,fig:'rhodo',s:1},{a:.2,fig:'rhodo',s:.8}], L2:[{a:.3,fig:'gompa',s:.6}] } },

/* 9 ─ Folk dances of Sikkim I */
{ id:'sikdance1', panda:.6, items:[
  {type:'card', x:120, y:64, w:1000, rot:.4, pin:true, html:`
    <div class="speaker-tag">Presenter: Dhruv Kumbhar</div>
    <h2>Masks of the <em class="in">monastery</em></h2>
    <ul>
      <li><b>Singhi Chham</b> — the Snow Lion dance: two dancers inside a white, turquoise-maned lion honour Khangchendzonga; introduced by the 3rd Chogyal, <b>Chakdor Namgyal</b> (18th c.).</li>
      <li><b>Pang Toed Chaam</b> — warrior dance of <b>Pang Lhabsol</b> (15th day of the 7th Tibetan month) at Tsuklakhang, Gangtok; masked warriors salute the mountain god — choreographed, legend says, after the Chogyal\u2019s vision.</li>
      <li><b>Kagyed Chaam</b> — lamas\u2019 masked dance on the 28th–29th day of the 10th Tibetan month, before Losoong, burning away evil for the new year; Phodong, Tsuklakhang, Rumtek.</li>
      <li><b>Rumtek Chaam</b> & <b>Enchey Chaam</b> — Mahakala dance (10th day of the 5th month) and the Pang Lhabsol dances at Enchey.</li>
      <li><b>Yak Chham</b> — herders\u2019 tribute to the yak; two dancers inside a shaggy costume.</li>
      <li><b>Tashi Sabdo</b> welcomes guests with khada scarves; <b>Denzong Neh-Na</b> praises the hidden valley; <b>Lu Khangthamo</b> gives thanks at Losoong; <b>Be Yu Mista</b> and <b>Gha To Kito</b> sing of Sikkim\u2019s youth and beauty.</li>
    </ul>`},
  {type:'note', x:1250, y:905, html:`<b>Singhi Chham</b>, the snow lion, and a <b>Kagyed</b> dancer in a skull-crowned mask`},
 ],
 scene:{ L7:[{a:.72,fig:'snowLion',s:2.2},{a:.92,fig:'chaamDancer',s:2.4},{a:.6,fig:'butterLamp',s:1.8}], L5:[{a:.8,fig:'gompa',s:1.7},{a:.66,fig:'flags'}] } },

/* 10 ─ Folk dances of Sikkim II */
{ id:'sikdance2', panda:.5, items:[
  {type:'card', x:860, y:64, w:940, rot:-.4, pin:true, html:`
    <div class="speaker-tag">Presenter: Aditya Jagdale</div>
    <h2>Dances of the <em class="in">valleys</em></h2>
    <div class="cols small" style="margin-top:12px">
      <div><p class="cap">Lepcha</p><ul>
        <li><b>Zo-Mal-Lok</b> — sowing, reaping and harvesting paddy; men and women together with drum, flute and cymbal.</li>
        <li><b>Chu Faat</b> — worship of Khangchendzonga and its four peaks on the 15th day of the 7th Buddhist month, with butter lamps and bamboo leaves.</li>
        <li><b>Tendong Lho Rum Faat</b> — thanks to Tendong Hill, which saved the Lepchas from the great flood (8 August).</li>
        <li><b>Kinchum-Chu-Bomsa</b> — the beauty of Sikkim; <b>Mun</b> and <b>Bongthing</b> rituals.</li></ul></div>
      <div><p class="cap">Nepali</p><ul>
        <li><b>Maruni</b> — the oldest Nepali dance: Tihar and weddings, men in women\u2019s dress, the clown <i>Dhatu Waray</i>, the nine-piece <b>Naumati Baja</b>.</li>
        <li><b>Tamang Selo</b> — the Tamang <b>damphu</b> drum and <i>Hwai</i> songs; pioneered on record by Hira Devi Waiba.</li>
        <li><b>Chutkey</b>, lively and young; <b>Sorathi</b>, the tale of King Jaisingh; <b>Dhaan Naach</b> and <b>Chyabrung</b> of the Limbus.</li>
        <li><b>Sakela</b> (Chandi Naach) of the Rais; <b>Khukuri Naach</b>; <b>Sebru</b> of the Sherpas; <b>Ghatu</b> of the Gurungs.</li></ul></div>
    </div>`},
  {type:'note', x:120, y:905, html:`<b>Maruni</b> dancer, a <b>damphu</b> drummer and the Lepcha <b>Zo-Mal-Lok</b> harvest`},
 ],
 scene:{ L7:[{a:.24,fig:'maruni',s:2.5},{a:.38,fig:'drummer',s:2.4},{a:.15,fig:'lepchaPair',s:2.0},{a:.6,fig:'rhodo',s:.9}], L5:[{a:.34,fig:'flags'},{a:.26,fig:'hut',s:1.6}] } },

/* 11 ─ Sikkimese culture & cuisine */
{ id:'sikculture', panda:.66, items:[
  {type:'card', x:120, y:84, w:1120, rot:.3, pin:true, html:`
    <div class="speaker-tag">Presenter: Aditya Jagdale</div>
    <h2>Festivals, <em class="in">food</em> and mountain life</h2>
    <div class="cols3 small" style="margin-top:14px">
      <div><p class="cap">Festivals</p><ul>
        <li><b>Losar</b> — Tibetan New Year, February</li><li><b>Losoong / Namsoong</b> — harvest new year, with Kagyed</li><li><b>Saga Dawa</b> — Buddha\u2019s birth, enlightenment, nirvana</li><li><b>Pang Lhabsol</b> — the mountain\u2019s own festival</li><li><b>Bumchu</b> at Tashiding; <b>Dasain</b> & <b>Tihar</b></li><li>Maghe Sankranti, Sonam Lochar, Tendong Lho Rum Faat</li></ul></div>
      <div><p class="cap">Food</p><ul>
        <li><b>Momo</b> and <b>thukpa</b>, gya thuk</li><li><b>Phagshapa</b> — pork with radish and chillies</li><li><b>Gundruk & sinki</b> — fermented greens and radish</li><li><b>Kinema</b> (fermented soybean), <b>chhurpi</b> cheese</li><li><b>Sel roti</b> — ring-shaped rice bread of Tihar</li><li><b>Chhang / tongba</b> millet brew; Temi tea</li></ul></div>
      <div><p class="cap">Living</p><ul>
        <li><b>Bakhu</b> with honju and pangden (Bhutia)</li><li><b>Dumvum</b>, thokro-dum and the thyaktuk cap (Lepcha)</li><li><b>Daura-suruwal</b>, gunyu-cholo, dhaka topi (Nepali)</li><li>Thangka painting, <b>choktse</b> tables, dragon carpets</li><li>Prayer flags, chortens, <i>mani</i> walls</li><li>Damphu, madal, chyabrung, flute and long horns</li></ul></div>
    </div>`},
  {type:'note', x:1310, y:905, html:`Momos in a bamboo steamer, thukpa, sel roti, tongba and butter lamps`},
 ],
 scene:{ L7:[{a:.78,fig:'foodSikkim',s:1.9},{a:.94,fig:'rhodo',s:.9},{a:.62,fig:'prayerWheel',s:1.7}], L5:[{a:.8,fig:'gompa',s:1.6},{a:.66,fig:'flags'}] } },

/* 12 ─ Historical evolution: Sikkim */
{ id:'sikhistory', panda:.62, items:[
  {type:'card', x:120, y:60, w:1170, rot:-.3, pin:true, html:`
    <div class="speaker-tag">Presenter: Dhruv Kumbhar</div>
    <h2>How Sikkim\u2019s dances <em class="in">evolved</em></h2>
    <div class="tl small" style="margin-top:10px">
      <div class="yr">Earliest</div><div>Lepcha nature worship — <b>Mun</b> priestesses and <b>Bongthing</b> shamans; dances to the mountain, the hill and the paddy: Chu Faat, Tendong Lho Rum Faat, Zo-Mal-Lok.</div>
      <div class="yr">13th–15th c.</div><div>Bhutia migration from Tibet; the <b>blood-brotherhood</b> of Lepchas and Bhutias sworn at Kabi Longchok, with Khangchendzonga as witness.</div>
      <div class="yr">1642 · 1705</div><div>Phuntsog Namgyal crowned first <b>Chogyal</b> at Yuksom by three lamas; Buddhist <b>Chaam</b> masked dances arrive with the monasteries — Pemayangtse (1705).</div>
      <div class="yr">1700–1717</div><div>The 3rd Chogyal <b>Chakdor Namgyal</b> institutes <b>Pang Lhabsol</b> and its Pang Toed warrior dance; <b>Singhi Chham</b> follows in the 18th century.</div>
      <div class="yr">19th c.</div><div>Nepali settlers bring <b>Maruni, Tamang Selo, Sorathi, Sakela</b> and Chutkey; the Naumati Baja enters village life.</div>
      <div class="yr">1975 → today</div><div>Statehood; Cultural Affairs & Heritage Department troupes; Namsoong and Losar in Gangtok; Pang Lhabsol a public holiday; folk dances at the Red Panda Winter Carnival.</div>
    </div>
    <p class="note" style="margin-top:12px"><b>Major exponents:</b> Sonam Tshering Lepcha (Padma Shri 2007 — 400 songs, 102 folk dances, reviver of Lepcha culture) · Hira Devi Waiba (1940–2011, first recorded Tamang Selo, <i>Chura ta Hoina Astura</i>) · the lamas of Tsuklakhang, Rumtek, Enchey and Pemayangtse, keepers of the Chaams.</p>`},
  {type:'note', x:1370, y:905, html:`Chorten, prayer wheels and a Lepcha <b>hut</b>`},
 ],
 scene:{ L7:[{a:.84,fig:'chorten',s:1.9},{a:.7,fig:'prayerWheel',s:1.8},{a:.74,fig:'prayerWheel',s:1.8},{a:.54,fig:'rhodo',s:.8}], L5:[{a:.78,fig:'hut',s:1.7},{a:.66,fig:'flags'}] } },

/* 14 ─ Comparative study */
{ id:'compare', panda:.2, items:[
  {type:'card', x:120, y:56, w:1680, rot:.2, pin:true, html:`
    <h2 style="font-size:40px">Goa and Sikkim, <em class="in">side by side</em></h2>
    <table class="cmp" style="margin-top:8px"><thead><tr><th></th><th>Goa <em>· coast</em></th><th>Sikkim <em>· mountain</em></th><th class="th">What we noticed</th></tr></thead><tbody>
      <tr class="row" style="--j:0"><td>Dance</td><td>Circle dances of women (Fugdi, Dhalo); warrior and harvest dances (Ghode Modni, Goff); Indo-Portuguese Mando, Dekhni, Corridinho. Ghumot, samel, violin.</td><td>Masked monastic Chaams (Singhi, Pang Toed, Kagyed); Lepcha harvest dances (Zo-Mal-Lok, Chu Faat); Nepali Maruni, Tamang Selo, Sakela. Damphu, madal, cymbals, long horns.</td><td class="th">Both grow out of harvest and worship. Goa\u2019s Perni Jagor and Carnival masks meet Sikkim\u2019s Chaam masks; Ghode Modni and Pang Toed are both warrior dances with a legend behind them.</td></tr>
      <tr class="row" style="--j:1"><td>Culture</td><td>Hindu–Catholic blend; Konkani; balcão houses and azulejos; Shigmo and Carnival in the same spring; <i>susegad</i>.</td><td>Buddhist–Hindu–animist blend; Lepcha, Bhutia and Nepali; monasteries, chortens and prayer flags; Losar, Dasain and Pang Lhabsol; reverence for the mountain.</td><td class="th">Layered faiths living together; two calendars of festivals; nature at the centre — the sea and coconut in Goa, the peak and rhododendron in Sikkim.</td></tr>
      <tr class="row" style="--j:2"><td>Food</td><td>Rice and fish curry; coconut, kokum, vinegar and chillies — vindaloo, xacuti, bebinca; <b>poee</b> bread; <b>feni</b>.</td><td>Rice and millet; fermented gundruk, kinema and chhurpi; momo and thukpa; <b>sel roti</b>; <b>chhang</b> and tongba.</td><td class="th">Rice is the staple in both; each has a signature bread (poee / sel roti) and a home-brewed drink (feni / chhang); both preserve food cleverly — pickling by the sea, fermenting in the cold.</td></tr>
    </tbody></table>`},
 ],

/* 16 ─ Reflective summary & conclusion */
{ id:'reflection', mode:'night', panda:.22, items:[
  {type:'card', x:330, y:80, w:1260, rot:.3, pin:true, html:`
    <h2>What the journey <em class="in">taught us</em></h2>
    <ul>
      <li>A chapter about a village baker opened into a whole culture: <b>bread, dance and festival are how a community remembers itself</b> — in Goa through the pader and the mando, in Sikkim through the Chaam and the sel roti.</li>
      <li>Two states that could not look more different share the same roots — <b>harvest, faith and the land</b> — which is why <i>Ek Bharat Shreshtha Bharat</i> pairings make sense: difference on the surface, kinship underneath.</li>
      <li>Folk dances are living history books: the Ghode Modni and the Pang Toed Chaam both keep a <b>warrior\u2019s story</b> alive; both states also keep <b>mask traditions</b> that are centuries old.</li>
      <li>We learnt to <b>research responsibly</b> — checking dates, names and spellings, and citing where we read them — and to turn that research into a design others can enjoy.</li>
      <li>Collaboration meant dividing work by strength, giving honest peer feedback, and <b>speaking for at least a minute each</b> with confidence about our part.</li>
      <li>Above all, we learnt <b>respect</b>: for the baker\u2019s craft, the lama\u2019s dance and the many Indias that fit inside one classroom.</li>
    </ul>`},

<script>
/* ======================================================================
   WORLD — nine sheets of paper, each a long continuous strip.  Sheet i
   scrolls at LAYERS[i].f × the camera speed, so a slide change is a real
   camera pan through a single diorama: there are no seams to hide.
   Biomes: forest (plate I) → Goa (II–VIII) → Sikkim (IX–XIV) → forest at
   night (XV–XVIII).  Transitions between biomes are ramped so far sheets
   change slowly and the foreground changes exactly at a slide boundary.

   Each sheet is generated one W-wide tile at a time.  A tile is a pure
   function of (seed, sheet, index), so the deck can build only the tiles
   that are actually on screen — the whole 42,000px strip is never parsed
   on a phone.
   ====================================================================== */
const WORLD = (() => {
  'use strict';
  const F = PAPER;
  const W = 1920, H = 1080, M = 80;
  const N = SLIDES.length;
  const U = Math.sqrt(W*H)/100;                  // the reference unit (14.4px)
  const LAYERS = {
    L1:{f:.12,sh:3,depth:1}, L2:{f:.22,sh:3,depth:2}, L3:{f:.34,sh:4,depth:3}, L4:{f:.48,sh:4,depth:4},
    L5:{f:.64,sh:5,depth:5}, L6:{f:1.0,sh:6,depth:6}, L7:{f:1.0,sh:6,depth:7}, L8:{f:1.22,sh:7,depth:8},
  };
  const widthOf = f => W + (N-1)*W*f;
  const ux = (k,a,f) => a*W + k*W*f;             // layer x for slide k at screen fraction a
  const { rr, q, clamp, cut, hole, poly, circ, ell, rect, wave, ridge, pine, blade, P, G } = F;
  const R = () => F.R();

  let SEED = 1847;
  const seedLayer = n => { F.setSeed((SEED ^ Math.imul(n, 0x9e3779b9)) >>> 0); };
  const seedTile = (layer,j) => {
    let h = (SEED ^ Math.imul(layer, 0x9e3779b9) ^ Math.imul(j+1, 0x85ebca6b)) >>> 0;
    h ^= h >>> 16; h = Math.imul(h, 0x7feb352d);
    h ^= h >>> 15; h = Math.imul(h, 0x846ca68b);
    h ^= h >>> 16; F.setSeed(h >>> 0);
  };
  // a layer is an ordered list of lazily generated tiles
  const makeLayer = (f,fn) => ({
    n: Math.ceil((widthOf(f)+2*M)/W)+1,
    make(j){ const u0=j*W-M; return fn(j,u0,u0+W); },
  });
  // slide indices whose W-wide band can reach this tile
  const slidesNear = (u0,u1,f,pad=W) => {
    const lo = Math.max(0, Math.floor((u0-pad)/(W*f))-1);
    const hi = Math.min(N-1, Math.ceil((u1+pad)/(W*f))+1);
    return [lo,hi];
  };

  /* ---------- biomes ---------- */
  function edge(u,kb,f){const c=kb*W*f+W*(f>=1?1.15:.95),hw=W*(f>=1?.15:.18);return F.smooth((u-c+hw)/(2*hw));}
  function biome(u,f){const g1=edge(u,0,f),g2=edge(u,7,f),g3=edge(u,13,f);return {goa:g1-g2,sikkim:g2-g3,forest:1-g1+g3};}
  function pick(u,f){const b=biome(u,f),r=R();return r<b.goa?'goa':(r<b.goa+b.sikkim?'sikkim':'forest');}

  /* ---------- scene bookkeeping ---------- */
  function heroes(layer){
    const out=[];const f=LAYERS[layer].f;
    SLIDES.forEach((sl,k)=>{const list=(sl.scene||{})[layer]||[];for(const h of list)out.push(Object.assign({k,u:ux(k,h.a,f)},h));});
    return out;
  }
  const winGlow=(x,y,r)=>`<circle class="winglow" cx="${q(x)}" cy="${q(y)}" r="${q(r)}" fill="url(#winGlowGrad)"/>`;
  const jitter=(x,j)=>{if(j<=0)return 0;const h=Math.sin(x*127.1+311.7)*43758.5453123;return((h-Math.floor(h))-.5)*2*j;};
  function ridgeChunk(fn,bottom,x0,x1,step=8,j=.9,overlap=2){
    const p=[];const right=x1+overlap;
    for(let x=x0;x<=right;x+=step)p.push([x,fn(x)+jitter(x,j)]);
    if(p[p.length-1][0]<right)p.push([right,fn(right)+jitter(right,j)]);
    p.push([right,bottom],[x0,bottom]);
    return poly(p);
  }
  function riverChunk(yc,hw,x0,x1,step=10,overlap=2){
    const T=[],B=[];const right=x1+overlap;
    for(let u=x0;u<=right;u+=step){const jit=jitter(u*1.5,.8);T.push([u,yc(u)-hw(u)+jit]);B.push([u,yc(u)+hw(u)+jit]);}
    if(T[T.length-1][0]<right){const jit=jitter(right*1.5,.8);T.push([right,yc(right)-hw(right)+jit]);B.push([right,yc(right)+hw(right)+jit]);}
    return poly(T.concat(B.reverse()));
  }

  /* ---------- sheet 1 — far hills, rising into the Himalaya ---------- */
  function buildL1(){
    seedLayer(1);
    const f=LAYERS.L1.f;
    const far=wave(H*.395,[H*.034,H*.016,H*.007],[W*1.15,W*.43,W*.16]);
    const env=u=>F.smooth((u-1.15*W)/(.3*W))*(1-F.smooth((u-2.5*W)/(.4*W)));
    const peaks=[];let u=1.1*W;
    while(u<2.95*W){const w=W*rr(.05,.11),h=H*rr(.1,.27);peaks.push({c:u+w*.5,w,h});u+=w*rr(.9,1.4);}
    peaks.push({c:1.78*W,w:W*.13,h:H*.33});peaks.push({c:1.7*W,w:W*.07,h:H*.24});peaks.push({c:1.87*W,w:W*.08,h:H*.26});
    const prof=u=>{let y=0;for(const p of peaks){const d=Math.abs(u-p.c);if(d<p.w)y=Math.max(y,p.h*(1-d/p.w));}return y;};
    const fn=u=>far(u)-env(u)*prof(u);
    const snowy=[];
    for(const p of peaks){
      const e=env(p.c);if(e<.25||p.c<1.5*W)continue;
      snowy.push({p,e,tile:Math.floor((p.c+M)/W)});
    }
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(1,j);
      const d1=ridgeChunk(fn,H+M,u0,u1,8,.9,2);
      const g1=ridgeChunk(fn,H+M,u0,u1,8,.9,0);
      let sn='';
      for(const {p,e,tile} of snowy){
        if(tile!==j)continue;
        const top=[],bot=[];const a=p.c-p.w*.42,b=p.c+p.w*.42,n=14;
        for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;top.push([x,fn(x)+(R()-.5)*1.4]);}
        for(let i=n;i>=0;i--){const x=a+(b-a)*i/n,t=1-Math.abs((x-p.c)/(p.w*.42));bot.push([x,fn(x)+p.h*e*(.14+.24*t)+(i%2?6:-4)+(R()-.5)*4]);}
        sn+=poly(top.concat(bot));
      }
      return `<path class="c-far" d="${d1}"/><path class="c-snow" d="${sn}"/><path class="grain" d="${g1}"/>`;
    });
  }

  /* ---------- sheet 2 — rolling hill with tiny trees and far buildings ---------- */
  function buildL2(){
    seedLayer(2);
    const f=LAYERS.L2.f;
    const hill=wave(H*.47,[H*.036,H*.014,H*.006],[W*.9,W*.34,W*.13]);
    const phs=R()*6;
    const hs=heroes('L2');
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(2,j);
      const t={trees:'',roofs:'',wins:'',glows:'',bld:'',cuts:''};
      for(let x=u0;x<u1;x+=rr(5,15)){
        if(Math.sin(x/W*8.5+phs)+Math.sin(x/W*21+phs*2)*.5>.35){
          const h=rr(2.1,4.2)*U,b=pick(x,f);
          if(b==='goa'){if(R()<.7)t.trees+=F.palm(x,hill(x)+3,h*1.1,rr(-.3,.3)*h,5);else t.trees+=F.roundTree(x,hill(x)+3,h*.8,h*.9);}
          else t.trees+=pine(x,hill(x)+3,h,h*.55);
        }
      }
      for(const h of hs){
        if(h.u<u0||h.u>=u1)continue;
        const cx=h.u;
        if(h.fig==='cottage'){
          const s=Math.max(12,U*2.3),by=hill(cx)+s*.25;
          t.cuts+=cut([[cx-s*.52,by],[cx-s*.52,by-s*.62],[cx+s*.52,by-s*.62],[cx+s*.52,by]],.4,5);
          t.cuts+=cut([[cx+s*.2,by-s*.8],[cx+s*.2,by-s*1.12],[cx+s*.36,by-s*1.12],[cx+s*.36,by-s*.7]],.3,4);
          t.roofs+=cut([[cx-s*.66,by-s*.54],[cx,by-s*1.08],[cx+s*.66,by-s*.54]],.4,4);
          for(const wx of [-.26,.18]){t.wins+=poly([[cx+wx*s,by-s*.42],[cx+(wx+.15)*s,by-s*.42],[cx+(wx+.15)*s,by-s*.24],[cx+wx*s,by-s*.24]]);}
          t.glows+=winGlow(cx,by-s*.35,s*1.5);
        }else{
          const s=h.s||.6,by=hill(cx)+4;
          const fig=F[h.fig]?F[h.fig](h.fig==='house'):'';
          t.bld+=G(cx,by,s,fig);
          t.glows+=winGlow(cx,by-30*s,70*s);
        }
      }
      const d2=ridgeChunk(hill,H+M,u0,u1,8,.9,2);
      const g2=ridgeChunk(hill,H+M,u0,u1,8,.9,0);
      let s=`<path class="c-hill" d="${d2}${t.cuts}"/><path class="grain" d="${g2}"/>`;
      if(t.trees)s+=`<path class="c-hill" d="${t.trees}"/><path class="grain" d="${t.trees}"/>`;
      if(t.roofs)s+=`<path class="c-roof" d="${t.roofs}"/><path class="grain" d="${t.roofs}"/>`;
      if(t.glows)s+=t.glows;
      if(t.wins)s+=`<path class="c-win" d="${t.wins}"/>`;
      if(t.bld)s+=t.bld;
      return s;
    });
  }

  /* ---------- sheet 3 — the sage tree ridge: pines, palms, broadleaf ---------- */
  function buildL3(){
    seedLayer(3);
    const f=LAYERS.L3.f;
    const rg=wave(H*.545,[H*.014,H*.007],[W*.7,W*.23]);
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(3,j);
      let trees='';let x=u0;
      while(x<u1){
        const b=pick(x,f);let w;
        if(b==='goa'){
          if(R()<.62){const h=rr(4,8.2)*U;w=h*.9;trees+=F.palm(x,rg(x)+4,h,rr(-.25,.25)*h,rr(5,7)|0);x+=w*rr(.3,.55);}
          else{const h=rr(3,5.2)*U;w=h*1.15;trees+=F.roundTree(x,rg(x)+4,h,w);x+=w*rr(.5,.8);}
        }else{
          const h=rr(3.6,7.8)*U;w=h*rr(.46,.58);
          if(b==='sikkim'&&R()<.18)trees+=F.roundTree(x,rg(x)+4,h*.7,w*1.6);else trees+=pine(x,rg(x)+4,h,w);
          x+=w*rr(.42,.8);
        }
      }
      const d3=ridgeChunk(rg,H+M,u0,u1,8,.9,2);
      const g3=ridgeChunk(rg,H+M,u0,u1,8,.9,0);
      return `<path class="c-ridge" d="${d3}${trees}"/><path class="grain" d="${g3}${trees}"/>`;
    });
  }

  /* ---------- sheet 4 — meadow, the long river and its branches ---------- */
  let riverY=()=>H*.7;
  function buildL4(){
    seedLayer(4);
    const f=LAYERS.L4.f;
    const md=wave(H*.6,[H*.008,H*.004],[W*.8,W*.25]);
    const p1=R()*6,p2=R()*6,p3=R()*6;
    const yc=u=>H*.705+H*.026*Math.sin(u/(.9*W)*Math.PI*2+p1)+H*.011*Math.sin(u/(.31*W)*Math.PI*2+p2);
    const hw=u=>H*.011+H*.036*biome(u,f).goa+H*.004*Math.sin(u/(.5*W)*Math.PI*2+p3);
    riverY=yc;
    const hs=heroes('L4');
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(4,j);
      const t={dr:'',rip:'',gl:'',bld:''};
      for(let k=0;k<N;k++){
        const uc=ux(k,.52,f);
        if(uc<u0||uc>=u1)continue;
        const yTop=yc(uc),yBot=H*.86,n=40,amp=W*.12,ph=R()*.7-.2,cl=[],Lb=[],Rb=[];
        for(let i=0;i<=n;i++){
          const tt=i/n,y=yTop+(yBot-yTop)*Math.pow(tt,1.3);
          const x=uc+amp*Math.sin(tt*Math.PI*1.9+ph)*Math.pow(tt,.65)+W*.03*Math.sin(tt*9+ph);
          const w=W*.012+W*.25*Math.pow(tt,1.75);
          cl.push([x,y,w]);Lb.push([x-w/2+(R()-.5)*1.4,y]);Rb.push([x+w/2+(R()-.5)*1.4,y]);
        }
        Lb.push([cl[n][0]-cl[n][2]/2,H+M],[cl[n][0]+cl[n][2]/2,H+M]);
        t.dr+=poly(Lb.concat(Rb.reverse()));
        for(let i=0;i<22;i++){const kk=Math.floor(rr(.18,1)*n),[x,y,w]=cl[kk],cx=x+(R()-.5)*w*.55,len=w*rr(.12,.32),th=Math.max(1,w*.022);t.rip+=poly([[cx-len/2,y],[cx,y-th],[cx+len/2,y],[cx,y+th*.6]]);}
        for(let i=0;i<16;i++){const kk=Math.floor(rr(.1,.95)*n),[x,y,w]=cl[kk],cx=x+(R()-.5)*w*.35,len=Math.max(3,w*rr(.05,.14)),th=Math.max(.8,w*.012);t.gl+=`<path class="glint" style="animation-delay:${(R()*3).toFixed(2)}s" d="${poly([[cx-len/2,y],[cx,y-th],[cx+len/2,y],[cx,y+th]])}"/>`;}
      }
      // ripples on the long river across this tile
      for(let k=0;k<N;k++){
        for(let i=0;i<10;i++){
          const u=ux(k,R(),f);
          if(u<u0||u>=u1)continue;
          const y=yc(u)+(R()-.5)*hw(u)*1.2,len=rr(10,30),th=1.2;
          t.rip+=poly([[u-len/2,y],[u,y-th],[u+len/2,y],[u,y+th*.6]]);
        }
      }
      for(const h of hs){if(h.u>=u0&&h.u<u1){const s=h.s||1;t.bld+=G(h.u,yc(h.u)+hw(h.u)*.2,s,F.boat());}}
      const d4=ridgeChunk(md,H+M,u0,u1,8,.6,2);
      const g4=ridgeChunk(md,H+M,u0,u1,8,.6,0);
      const dr=riverChunk(yc,hw,u0,u1,10,2);
      let s=`<path class="c-meadow" d="${d4}"/><path class="c-river" d="${dr}${t.dr}"/><path class="grain" d="${g4}"/>`;
      if(t.rip)s+=`<path class="c-ripple" d="${t.rip}"/>`;
      if(t.gl)s+=t.gl;
      if(t.bld)s+=t.bld;
      return s;
    });
  }

  /* ---------- sheet 5 — moss banks with an opening on every plate ---------- */
  let bank5=()=>H;
  function buildL5(){
    seedLayer(5);
    const f=LAYERS.L5.f,y5=H*.675;
    const w5=wave(0,[H*.012,H*.006],[W*.5,W*.17]);
    const centers=[];for(let k=0;k<=N;k++)centers.push(ux(k,.5,f));
    const near=u=>{let d=1e9;for(const c of centers)d=Math.min(d,Math.abs(u-c));return d;};
    const yb=u=>{const d=near(u),s=clamp(1-(d-.09*W)/(.16*W),0,1);return y5+w5(u)+Math.pow(s,3)*(H+M-y5)*1.02;};
    bank5=yb;
    const hs=heroes('L5');
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(5,j);
      let trees='',svg='',glows='';
      for(let x=u0;x<u1;){
        const y=yb(x);const d=near(x),fromEdge=clamp(1-(d-.1*W)/(.25*W),0,1);
        const b=pick(x,f);let w;
        if(y<H*.95){
          if(b==='goa'){const h=rr(H*.16,H*.3)*(1-fromEdge*.45);w=Math.min(h*.9,W*.14);if(R()<.7)trees+=F.palm(x,y+5,h,rr(-.3,.3)*h*.6,rr(5,8)|0);else trees+=F.roundTree(x,y+5,h*.7,w);x+=w*rr(.28,.5);}
          else{const h=rr(H*.2,H*.36)*(1-fromEdge*.5);w=Math.min(h*.44,W*.14);trees+=pine(x,y+5,h,w);x+=w*rr(.4,.7);}
        }else x+=rr(20,60);
      }
      for(const h of hs){
        if(h.u<u0||h.u>=u1)continue;
        const u=h.u,y=yb(u)+6;
        if(h.fig==='flags'){const fl=F.flagLine(u-95,y-150,u+125,y-125,28,12,15);svg+=P('c-wood',poly([[u-97,y+2],[u-93,y+2],[u-94,y-150],[u-96,y-150]])+poly([[u+123,y+2],[u+127,y+2],[u+126,y-125],[u+124,y-125]]))+F.flagsSvg(fl);}
        else if(h.fig==='palmTall'){trees+=F.palm(u,y,H*.34,rr(-.2,.2)*H*.1,8);}
        else if(F[h.fig]){const s=h.s||1.6;svg+=G(u,y,s,F[h.fig](h.fig==='house'));if(h.fig!=='hut')glows+=winGlow(u,y-28*s,80*s);}
      }
      const d5=ridgeChunk(u=>Math.min(H+M,yb(u)),H+M,u0,u1,8,.8,2);
      const g5=ridgeChunk(u=>Math.min(H+M,yb(u)),H+M,u0,u1,8,.8,0);
      let s=`<path class="c-moss" d="${d5}${trees}"/>`;
      if(svg)s+=svg;
      if(glows)s+=glows;
      s+=`<path class="grain" d="${g5}"/>`;
      return s;
    });
  }

  /* ---------- sheet 6 — the tall teal giants that frame every plate ---------- */
  function buildL6(){
    seedLayer(6);
    const f=LAYERS.L6.f;const y6=H*.82;
    return {
      n:N,
      make(k){
        seedTile(6,k);
        const b=biome(ux(k,.5,f),f);const goa=b.goa>.5;
        let d6='';
        const giants=[[.015,1.02,1],[.098,.7,1],[.975,.96,-1],[.9,.64,-1]];
        for(const [gx,gh,side] of giants){
          const x=ux(k,gx,f),h=H*gh;
          if(goa){d6+=F.palm(x,y6+8,h*.86,side*h*.14,8);}
          else{const w=Math.min(h*.4,W*.2);d6+=pine(x,y6+8,h,w);}
        }
        return `<path class="c-teal" d="${d6}"/><path class="grain" d="${d6}"/>`;
      }
    };
  }

  /* ---------- sheet 7 — the ochre forest floor: props, figures, the red panda ---------- */
  let groundAt=()=>H*.785;
  function buildL7(){
    seedLayer(7);
    const f=LAYERS.L7.f;
    const g7w=wave(H*.785,[H*.011,H*.006],[W*.95,W*.3]);
    const hs=heroes('L7');
    const burrows=hs.filter(h=>h.fig==='burrow').map(h=>h.u);
    const burR=W*.1;
    const g7=u=>{let y=g7w(u);for(const b of burrows)y-=H*.04*Math.exp(-Math.pow((u-b)/burR,2));return y;};
    groundAt=g7;
    const occupied=(u,r)=>hs.some(h=>h.fig!=='burrow'&&h.fig!=='mushrooms'&&Math.abs(h.u-u)<r);
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(7,j);
      const per={tuft:'',fall1:'',fall2:'',pebble:'',fern:'',rleaf:'',rbloom:'',rdot:'',shell:'',burrow:'',stems:'',caps:'',dots:'',bld:''};
      // tufts
      for(let x=u0;x<u1;x+=rr(18,60)){const y=g7(x)+2,n=3+Math.floor(R()*3);for(let k=0;k<n;k++)per.tuft+=blade(x+k*2.2,y+2,rr(.9,2.1)*U,rr(-.6,.6)*U,rr(2,3.4));}
      // per plate: ferns, pebbles, fallen leaves, low tufts, biome extras
      const [k0,k1]=slidesNear(u0,u1,f,W);
      for(let k=k0;k<=k1;k++){
        const b=biome(ux(k,.5,f),f);
        for(const [ff,sz,dr2] of [[.03,13,1],[.33,9,-1],[.47,7,1],[.72,10,1],[.96,12,-1]]){
          const x=ux(k,ff,f);if(x<u0||x>=u1)continue;
          if(occupied(x,150))continue;
          const scale=b.goa>.5?.8:1;
          per.fern+=F.fern(x,g7(x)+4,sz*U*scale,dr2)+F.fern(x+U*.8,g7(x)+4,sz*U*.7*scale,-dr2);
        }
        for(let i=0;i<9;i++){const x=ux(k,rr(.05,.95),f);if(x<u0||x>=u1)continue;const y=g7(x)+rr(.6,3.5)*U,r=rr(.3,.75)*U;per.pebble+=cut(circ(x,y,r,9).map(([a,bb])=>[a,y+(bb-y)*.6]),.25,3);}
        const nFall=Math.round(W/48);
        for(let i=0;i<nFall;i++){
          const x=ux(k,rr(-.02,1.02),f);if(x<u0||x>=u1)continue;
          const top=g7(x)+U*2.2,y=top+Math.pow(R(),1.3)*(H*.965-top),sz=rr(.45,.9)*U,a=R()*Math.PI,ca=Math.cos(a),sa=Math.sin(a);
          const lp=[[-1,0],[-.3,-.42],[.35,-.36],[1,0],[.3,.4],[-.35,.36]].map(([uu,v])=>[x+(uu*ca-v*sa*.8)*sz,y+(uu*sa+v*ca*.8)*sz*.62]);
          if(b.goa>.5&&R()<.35){per.shell+=cut(circ(x,y,sz*.55,8).map(([a2,b2])=>[a2,y+(b2-y)*.7]),.2,3);}
          else if(R()<.6)per.fall1+=cut(lp,.2,3);else per.fall2+=cut(lp,.2,3);
        }
        for(let i=0;i<Math.round(W/90);i++){const x=ux(k,R(),f);if(x<u0||x>=u1)continue;const y=g7(x)+rr(.24,.8)*(H*.95-g7(x));for(let kk=0;kk<3;kk++)per.tuft+=blade(x+kk*2.4,y,rr(.6,1.4)*U,rr(-.5,.5)*U,rr(2,3));}
        if(b.sikkim>.5){for(let i=0;i<3;i++){const x=ux(k,rr(.02,.98),f);if(x<u0||x>=u1)continue;if(occupied(x,170))continue;const rb=F.rhodoBush(x,g7(x)+rr(1,3)*U,rr(26,46));per.rleaf+=rb.leaf;per.rbloom+=rb.bloom;per.rdot+=rb.dot;}}
      }
      // heroes
      for(const h of hs){
        if(h.u<u0||h.u>=u1)continue;
        const x=h.u,y=g7(x);
        if(h.fig==='burrow'){
          const bw=Math.max(18,W*.042),bh=bw*.72,by0=g7(x)+bh*1.25;
          const arch=[[x-bw/2,by0]];for(let i=0;i<=12;i++){const a=Math.PI+i/12*Math.PI;arch.push([x+Math.cos(a)*bw/2,by0-bh*.35+Math.sin(a)*bh*.9]);}arch.push([x+bw/2,by0]);
          per.burrow+=cut(arch,.6,5);
        }else if(h.fig==='mushrooms'){
          const n=h.n||3;
          for(let k=0;k<n;k++){const mx=x+(k-(n-1)/2)*U*rr(1.4,2.6),s=U*rr(1.1,3.1)*(k===Math.floor(n/2)?1.25:1);const m=F.mushroom(mx,g7(mx)+s*.18,s);per.stems+=m.stem;per.caps+=m.cap;per.dots+=m.dots;}
        }else if(h.fig==='rhodo'){
          const rb=F.rhodoBush(x,y+6,54*(h.s||1));per.rleaf+=rb.leaf;per.rbloom+=rb.bloom;per.rdot+=rb.dot;
        }else if(h.fig==='boatBeach'){
          per.bld+=G(x,y+6,h.s||1.4,F.boat());
        }else if(F[h.fig]){
          per.bld+=G(x,y+3,h.s||2,F[h.fig]());
        }
      }
      const d7=ridgeChunk(g7,H+M,u0,u1,8,.7,2);
      const g7_grain=ridgeChunk(g7,H+M,u0,u1,8,.7,0);
      let s=`<path class="c-ground" d="${d7}"/>`;
      if(per.fall1)s+=`<path class="c-fall1" d="${per.fall1}"/>`;
      if(per.fall2)s+=`<path class="c-fall2" d="${per.fall2}"/>`;
      if(per.shell)s+=`<path class="c-pebble" d="${per.shell}"/>`;
      if(per.tuft)s+=`<path class="c-tuft" d="${per.tuft}"/>`;
      if(per.pebble)s+=`<path class="c-pebble" d="${per.pebble}"/>`;
      if(per.fern||per.rleaf)s+=`<path class="c-fern" d="${per.fern}${per.rleaf}"/>`;
      if(per.rbloom)s+=`<path class="c-bell" d="${per.rbloom}"/>`;
      if(per.rdot)s+=`<path class="c-bell2" d="${per.rdot}"/>`;
      if(per.burrow)s+=`<path class="c-burrow" d="${per.burrow}"/>`;
      if(per.stems)s+=`<path class="c-stem" d="${per.stems}"/>`;
      if(per.caps)s+=`<path class="c-cap" d="${per.caps}"/>`;
      s+=`<path class="grain" d="${g7_grain}${per.stems}${per.caps}"/>`;
      if(per.dots)s+=`<path class="c-dot glowdots" d="${per.dots}"/>`;
      if(per.bld)s+=per.bld;
      return s;
    });
  }

  /* ---------- sheet 8 — foreground grasses and tall flower spikes ---------- */
  function buildL8(){
    seedLayer(8);
    const f=LAYERS.L8.f;
    const g8=wave(H*.945,[H*.008,H*.005],[W*.6,W*.2]);
    const centers=[];for(let k=0;k<N;k++)centers.push(ux(k,.5,f));
    return makeLayer(f,(j,u0,u1)=>{
      seedTile(8,j);
      let fg='',fg2='',stalk='',bell='',inner='';
      for(let x=u0;x<u1;x+=rr(3.5,9)){
        let d=1e9;for(const c of centers)d=Math.min(d,Math.abs(x-c));
        const s=d/(W/2),hm=H*(.018+.23*Math.pow(clamp(s,0,1.2),2.4)),h=hm*rr(.35,1),lean=rr(-.38,.38)*h,wb=rr(4,9)*(U/11+.4);
        const b=blade(x,g8(x)+6,h,lean,wb);
        if(R()<.3)fg2+=b;else fg+=b;
      }
      const [k0,k1]=slidesNear(u0,u1,f,W);
      for(let k=k0;k<=k1;k++){
        const bm=biome(ux(k,.5,f),f);
        for(const [fx,fh,fl,sd] of [[.065,.4,.05,1],[.115,.29,-.03,1],[.925,.36,-.04,-1],[.885,.24,.03,-1]]){
          const x=ux(k,fx,f);if(x<u0||x>=u1)continue;
          const fn=bm.sikkim>.5?F.rhodoSpike:F.foxglove;
          const fgx=fn(x,g8(x)+4,H*fh,W*fl,sd);stalk+=fgx.stalk;bell+=fgx.bells;inner+=fgx.inner;
        }
      }
      const d8=ridgeChunk(g8,H+M,u0,u1,8,.8,2);
      const g8_grain=ridgeChunk(g8,H+M,u0,u1,8,.8,0);
      let s=`<path class="c-fg" d="${d8}${fg}${stalk}"/>`;
      if(fg2)s+=`<path class="c-fg2" d="${fg2}"/>`;
      if(bell)s+=`<path class="c-bell" d="${bell}"/>`;
      if(inner)s+=`<path class="c-bell2" d="${inner}"/>`;
      s+=`<path class="grain" d="${g8_grain}${fg}${fg2}${stalk}${bell}"/>`;
      return s;
    });
  }

  /* ---------- sheet 9 — the box: deckle-edged cream mat in a dark board frame ---------- */
  function buildFrame(){
    seedLayer(9);
    const e=Math.max(10,Math.min(W,H)*.024),rad=e*3;
    const outer=[[-M-4,-M-4],[W+M+4,-M-4],[W+M+4,H+M+4],[-M-4,H+M+4]];
    const rrect=(ins,wob)=>{const p=[],x0=ins,y0=ins,xx1=W-ins,y1=H-ins,r=rad;
      const seg=(ax,ay,bx,by)=>{const L=Math.hypot(bx-ax,by-ay),k=Math.max(1,Math.round(L/11));for(let t=0;t<k;t++){const u=t/k;p.push([ax+(bx-ax)*u+(R()-.5)*wob,ay+(by-ay)*u+(R()-.5)*wob]);}};
      const arc=(cx,cy,a0)=>{for(let i=0;i<6;i++){const a=a0+i/6*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}};
      seg(x0+r,y0,xx1-r,y0);arc(xx1-r,y0+r,-Math.PI/2);seg(xx1,y0+r,xx1,y1-r);arc(xx1-r,y1-r,0);seg(xx1-r,y1,x0+r,y1);arc(x0+r,y1-r,Math.PI/2);seg(x0,y1-r,x0,y0+r);arc(x0+r,y0+r,Math.PI);
      return p;};
    const mat=cut(outer,0,4000)+hole(rrect(e,2.4),.5,6);
    const frame=cut(outer,0,4000)+hole(rrect(e*.55,1.2),.3,8);
    return `<path class="c-mat" d="${mat}"/><path class="c-frame" d="${frame}"/><path class="grain" d="${frame}"/>`;
  }

  function build(seed){
    SEED = (seed||1847)>>>0;
    F.setSeed(SEED);
    return {
      L1:buildL1(), L2:buildL2(), L3:buildL3(), L4:buildL4(),
      L5:buildL5(), L6:buildL6(), L7:buildL7(), L8:buildL8(), L9:buildFrame(),
    };
  }
  return {W,H,M,N,U,LAYERS,widthOf,ux,build,groundAt:u=>groundAt(u),biome};
})();

</script>
<script>
/* ======================================================================
   DECK — camera, parallax, paper labels, the red panda, night, controls.

(() => {
  'use strict';
  // a pristine copy of this page, captured before any DOM is generated (used by "Save copy with poster")
  const PRISTINE='<!doctype html>\n'+document.documentElement.outerHTML;
  const $ = id => document.getElementById(id);
  const {W,H,M,N,U,LAYERS,ux} = WORLD;
  const F=PAPER, NS='http://www.w3.org/2000/svg';
  const S = Math.min(W,H)*.042;
  const depthF=d=>Math.pow(d/8,1.15)*S;
  const q = n => Math.round(n*10)/10, clamp=(v,a,b)=>v<a?a:v>b?b:v, rr=(a,b)=>a+(b-a)*Math.random();
