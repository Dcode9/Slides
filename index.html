<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Presentations made by Dhairya Shah</title>
  <meta name="description" content="Presentations and slide decks crafted by Dhairya Shah.">
  <meta name="theme-color" content="#09090b">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;450;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --fg-primary: #ededed;
      --fg-secondary: #71717a;
      --fg-muted: #52525b;
      --accent: #ffffff;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-glide: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Inter", system-ui, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--fg-primary);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient Spotlight & Fine Grain */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(680px circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.04), transparent 75%);
      transition: opacity 0.6s ease;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Main Viewport Container */
    .viewport {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Central Stage */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.65s var(--ease-out);
      will-change: transform;
    }

    .center-stage.expanded {
      transform: translateY(-44px);
    }

    /* Central Master Trigger */
    .master-trigger {
      appearance: none;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: var(--fg-primary);
      font-family: inherit;
      font-size: clamp(1.45rem, 2.6vw, 2.2rem);
      font-weight: 450;
      letter-spacing: -0.03em;
      line-height: 1.25;
      padding: 8px 18px;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      transition: color 0.3s ease, letter-spacing 0.35s var(--ease-out);
      border-radius: 9999px;
    }

    .master-trigger:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.4);
      outline-offset: 6px;
    }

    .trigger-text {
      position: relative;
      display: inline-block;
    }

    .trigger-text::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.4s var(--ease-out);
    }

    .master-trigger:hover .trigger-text::after {
      transform: scaleX(1);
    }

    /* Minimalist plus / minus glyph */
    .trigger-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      position: relative;
      color: var(--fg-secondary);
      transition: color 0.3s ease, transform 0.45s var(--ease-spring);
    }

    .trigger-indicator svg {
      width: 13px;
      height: 13px;
      stroke-width: 1.6;
      transition: transform 0.45s var(--ease-spring);
    }

    .master-trigger:hover {
      color: #ffffff;
    }

    .master-trigger:hover .trigger-indicator {
      color: #ffffff;
    }

    .center-stage.expanded .trigger-indicator {
      transform: rotate(45deg);
      color: var(--fg-secondary);
    }

    .center-stage.expanded .master-trigger:hover .trigger-indicator {
      color: #ffffff;
      transform: rotate(45deg) scale(1.1);
    }

    /* Pure Typography List (Zero UI) */
    .deck-list {
      list-style: none;
      margin-top: 20px;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      max-height: 0;
      overflow: visible;
      pointer-events: none;
      transition: opacity 0.35s ease, max-height 0.65s var(--ease-out);
    }

    .center-stage.expanded .deck-list {
      opacity: 1;
      max-height: 600px;
      pointer-events: auto;
    }

    .deck-item {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.4s var(--ease-out), transform 0.45s var(--ease-out);
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .center-stage.expanded .deck-item {
      opacity: 1;
      transform: translateY(0);
      transition-delay: calc(var(--i) * 45ms);
    }

    /* Individual Title Link */
    .deck-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: rgba(237, 237, 237, 0.72);
      font-size: clamp(1.1rem, 1.55vw, 1.35rem);
      font-weight: 400;
      letter-spacing: -0.022em;
      line-height: 1.35;
      padding: 6px 18px;
      position: relative;
      outline: none;
      transition: color 0.25s ease, opacity 0.3s ease, transform 0.28s var(--ease-glide), filter 0.3s ease;
      cursor: pointer;
    }

    .deck-link:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.4);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .deck-title {
      position: relative;
    }

    .deck-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.7), transparent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s var(--ease-out);
    }

    /* Arrow cue */
    .arrow-cue {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      opacity: 0;
      transform: translateX(-5px) translateY(1px);
      transition: opacity 0.25s var(--ease-out), transform 0.28s var(--ease-out);
      color: var(--fg-secondary);
    }

    .arrow-cue svg {
      width: 13px;
      height: 13px;
      stroke-width: 1.5;
    }

    /* Subtle Focus Dimming (Hover on fine pointers) */
    @media (hover: hover) and (pointer: fine) {
      .deck-list:hover .deck-link {
        opacity: 0.24;
        filter: blur(0.25px);
      }

      .deck-list:hover .deck-link:hover {
        opacity: 1;
        color: #ffffff;
        filter: none;
        transform: translateX(6px);
      }

      .deck-link:hover .deck-title::after {
        transform: scaleX(1);
      }

      .deck-link:hover .arrow-cue {
        opacity: 1;
        transform: translateX(0) translateY(1px);
        color: #ffffff;
      }
    }

    /* Touch refinement */
    @media (hover: none) {
      .deck-link:active {
        color: #ffffff;
        transform: scale(0.98);
      }
    }

    /* Subdued footer hint */
    .footer-note {
      position: fixed;
      bottom: 24px;
      font-size: 0.76rem;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      text-transform: uppercase;
      font-weight: 500;
    }

    .center-stage.expanded ~ .footer-note {
      opacity: 0.65;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .center-stage, .master-trigger, .deck-list, .deck-item, .deck-link, .arrow-cue, .trigger-indicator, .trigger-text::after, .deck-title::after {
        transition-duration: 0.01ms !important;
        animation: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Follower -->
  <div class="ambient-glow" id="ambientGlow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Viewport -->
  <main class="viewport">
    
    <div class="center-stage" id="centerStage">
      
      <!-- Minimalist Central Title & Micro-Interaction Trigger -->
      <button 
        type="button" 
        class="master-trigger" 
        id="masterTrigger" 
        aria-expanded="false" 
        aria-controls="deckList"
        aria-label="Presentations made by Dhairya Shah. Click to view all presentations."
      >
        <span class="trigger-text">Presentations made by Dhairya Shah</span>
        <span class="trigger-indicator" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
      </button>

      <!-- Pure Typography Presentation List (Zero UI) -->
      <ul class="deck-list" id="deckList" role="list">
        
        <li class="deck-item" style="--i:0">
          <a class="deck-link" href="/english-x-sigma" data-index="0">
            <span class="deck-title">Glimpses of India — Goa &amp; Sikkim</span>
            <span class="arrow-cue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
        </li>

        <li class="deck-item" style="--i:1">
          <a class="deck-link" href="/sciencev2" data-index="1">
            <span class="deck-title">Improvement in Food Resources</span>
            <span class="arrow-cue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
        </li>

        <li class="deck-item" style="--i:2">
          <a class="deck-link" href="/smvs" data-index="2">
            <span class="deck-title">World Cup 2026</span>
            <span class="arrow-cue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
        </li>

        <li class="deck-item" style="--i:3">
          <a class="deck-link" href="/yoga" data-index="3">
            <span class="deck-title">Entrepreneurial Skills</span>
            <span class="arrow-cue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
        </li>

        <li class="deck-item" style="--i:4">
          <a class="deck-link" href="/frenchv2" data-index="4">
            <span class="deck-title">Les Temps et La Conjugaison</span>
            <span class="arrow-cue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
        </li>

      </ul>

    </div>

    <div class="footer-note" aria-hidden="true">ESC TO CLOSE</div>

  </main>

  <script>
    (function() {
      const stage = document.getElementById('centerStage');
      const trigger = document.getElementById('masterTrigger');
      const glow = document.getElementById('ambientGlow');
      const links = Array.from(document.querySelectorAll('.deck-link'));
      let isExpanded = false;

      // Discreet Micro-haptic Audio Synthesizer (Pure Web Audio API, ultra-quiet tactile feedback)
      let audioCtx = null;
      function playMicroTick(pitch = 600, duration = 0.015, gainVal = 0.012) {
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioCtx = new AudioContextClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(pitch * 0.4, audioCtx.currentTime + duration);

          gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (_) {}
      }

      function toggleState(forceState) {
        isExpanded = typeof forceState === 'boolean' ? forceState : !isExpanded;
        stage.classList.toggle('expanded', isExpanded);
        trigger.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        playMicroTick(isExpanded ? 520 : 380, 0.02, 0.018);
      }

      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleState();
      });

      // Close when clicking outside the stage
      document.addEventListener('click', (e) => {
        if (isExpanded && !stage.contains(e.target)) {
          toggleState(false);
        }
      });

      // Subtle ambient spotlight tracking
      window.addEventListener('pointermove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--x', `${x}%`);
        document.documentElement.style.setProperty('--y', `${y}%`);
      }, { passive: true });

      // Tactile sound on hover
      links.forEach((link) => {
        link.addEventListener('mouseenter', () => {
          playMicroTick(760, 0.012, 0.009);
        });
      });

      // Keyboard Accessibility
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isExpanded) {
          toggleState(false);
          trigger.focus();
        } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && isExpanded) {
          e.preventDefault();
          const currentIndex = links.indexOf(document.activeElement);
          let nextIndex = 0;
          if (e.key === 'ArrowDown') {
            nextIndex = currentIndex < links.length - 1 ? currentIndex + 1 : 0;
          } else {
            nextIndex = currentIndex > 0 ? currentIndex - 1 : links.length - 1;
          }
          links[nextIndex].focus();
          playMicroTick(700, 0.01, 0.007);
        }
      });

      // URL hash deep linking (e.g. slides.d-verse.in/#list opens immediately)
      if (window.location.hash === '#list' || window.location.hash === '#all') {
        toggleState(true);
      }
    })();
  </script>

</body>
</html>
